.avl-filter-mono{filter:grayscale(1)}
.avl-choice-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.avl-choice-row button{padding:10px 5px;border:1px solid #ece4f0;background:#faf9fb;color:#8c7d96;border-radius:11px;font-size:10px;line-height:1.3;min-height:43px;font-weight:800}
.avl-choice-row button.selected{background:#f1e7f7;border-color:#b99dd2;color:#8562a5}
.avl-action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:20px}
.avl-action-grid .btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 4px;font-size:11px;margin:0;min-height:45px}
.avl-action-grid .ui-icon{width:15px;height:15px}
.avl-secondary-action{margin-top:9px;border:1px solid #ebe4ed;background:#faf8fc;color:#836b98;width:100%;min-height:43px;padding:10px;border-radius:13px;font-size:11px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:8px}
.avl-secondary-action .ui-icon{width:16px;height:16px}
.avl-hint{font-size:10px;color:#9a90a1;line-height:1.75;margin:12px 0 0}
.avl-preview-empty{border:1px dashed #e1d5e8;border-radius:15px;background:#fbf8fc;color:#9a89a4;padding:23px 16px;text-align:center;font-size:11px;line-height:1.6}
.avl-preset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avl-preset{background:#fcfafc;border:1px solid #ebe4ef;border-radius:16px;text-align:left;padding:7px 7px 11px;display:flex;flex-direction:column;gap:5px;color:#55465f}
.avl-preset.active{border-color:#b799ce;box-shadow:0 0 0 1px #b799ce}
.avl-preset-art{height:74px;display:block;width:100%;border-radius:11px;position:relative;overflow:hidden;background:linear-gradient(145deg,#f1e9f5,#d9c8ee)}
.avl-preset-art:before{content:'';position:absolute;height:58px;width:58px;left:50%;top:50%;transform:translate(-50%,-48%) rotate(-12deg);border-radius:17px;background:linear-gradient(140deg,#fffefa,#e1d3e8);box-shadow:12px 16px 20px #76628d33}
.avl-preset-art:after{content:'';position:absolute;bottom:11px;left:12%;right:12%;height:5px;background:#fff8;border-radius:50%;filter:blur(5px)}
.avl-art-premium{background:linear-gradient(145deg,#e3d3eb,#f8e9ef)}
.avl-art-premium:before{border-radius:8px;transform:translate(-50%,-45%) rotate(3deg);box-shadow:8px 11px 0 #cfb6dc,15px 18px 20px #76628d26}
.avl-art-lifestyle{background:linear-gradient(140deg,#f4efe7,#d8dfdf)}
.avl-art-lifestyle:before{border-radius:30px 30px 11px 11px;transform:translate(-50%,-45%) rotate(0)}
.avl-art-creative{background:linear-gradient(138deg,#e5d1eb,#f3c9d9 60%,#c4b1e2)}
.avl-art-creative:before{border-radius:50%;background:linear-gradient(140deg,#faf1fb,#edcbe0);transform:translate(-50%,-48%) rotate(0)}
.avl-preset strong{font-size:12px;margin:3px 5px 0}
.avl-preset small{font-size:10px;line-height:1.4;color:#9e90a3;margin:0 5px}
.avl-ai-field{margin-top:2px}
.avl-ai-field textarea{min-height:114px}
.avl-select-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:5px}
.avl-select-grid .field{margin-top:10px}
.avl-ai-generate{min-height:49px;margin-top:17px;font-size:12px!important}
.avl-ai-generate .ui-icon{width:16px;height:16px}
.avl-limit-caption{font-size:10px;color:#9e92a6;text-align:center;margin:10px 0 0}
.avl-edit-ideas{display:flex;gap:7px;flex-wrap:wrap;margin:5px 0 14px}
.avl-edit-ideas button{padding:9px 11px;background:#f5eff8;color:#816897;border:1px solid #ece2ef;border-radius:40px;font-size:10px;font-weight:800}
.avl-result .photo-preview{width:100%;display:block;max-height:400px;object-fit:contain;border-radius:16px;background:#f7f3f9}
.avl-bottom-note{display:flex;gap:8px;align-items:flex-start;color:#92859b;font-size:10px;line-height:1.6;margin:17px 6px 22px}
.avl-bottom-note svg{flex:0 0 17px;width:17px;height:17px}
@media(max-width:370px){.avl-panel{padding:12px}.avl-header h1{font-size:28px}.avl-mode strong{font-size:10px}.avl-filter{font-size:9px}.avl-choice-row button{font-size:9px}.avl-action-grid .btn{font-size:10px}}


/* Aurora 2.7 — avoid iOS Safari focus enlargement of editable fields. */
@supports (-webkit-touch-callout: none){input:not([type="checkbox"]):not([type="radio"]),textarea,select{font-size:16px!important}}
/* Aurora 2.7 — planner: compact and easy to tap in Telegram */
.aur-plan-meta{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:0 0 15px;flex-wrap:wrap}
.aur-sync-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;background:#f5eef9;border:1px solid #e9dcf2;border-radius:50px;font-size:10px;font-weight:800;color:#78599d}
.aur-sync-badge.online{color:#417f67;background:#eef9f3;border-color:#d0eee0}
.aur-sync-badge.issue{color:#9a6589;background:#fff2f9;border-color:#f4d7e6}
.aur-plan-filter{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0 5px}
.aur-plan-filter button{border:1px solid #eaddf1;background:#fff;border-radius:14px;padding:8px 11px;color:#806991;font-weight:800;font-size:11px}
.aur-plan-filter button.active{background:#f0defc;border-color:#d9b3eb;color:#7751a9}
.aur-plan-form{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:9px;margin-top:12px}
.aur-plan-form .field{margin:0}
.aur-plan-form .input{font-size:13px;min-height:45px}
.aur-task-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.aur-task-meta span{font-size:10px;color:#876d9d;border-radius:8px;background:#f6edf9;padding:2px 7px}
.aur-task-meta .overdue{color:#ae496a;background:#ffedf3}
.aur-task-meta .high{color:#97547e;background:#fbe6f4}
.aur-plan-backup{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.aur-plan-backup .btn{font-size:11px;flex:1;min-width:115px}

:root{
  color-scheme:dark;
  --ink:#fbf5ff; --muted:#b7a9c4; --line:rgba(235,196,250,.13);
  --paper:#292035; --wash:#17121e; --lav:#db98ff; --pink:#f38bd6;
  --violet:#b078e6; --shadow:0 14px 38px rgba(6,1,17,.27);
  --gradient:linear-gradient(125deg,#f2a0db,#d47ade 50%,#9c6df2);
  --night-glass:rgba(86,65,100,.29);
  --night-border:rgba(245,214,255,.13);
}
html{font-size:14px!important;background:#17121e;scrollbar-color:#5d4265 transparent}
body{
  font-family:Manrope,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  color:var(--ink)!important;
  background:
    radial-gradient(ellipse 55% 34% at 96% 18%,rgba(177,81,186,.28),transparent 76%),
    radial-gradient(ellipse 65% 28% at -10% 43%,rgba(98,55,150,.19),transparent 75%),
    radial-gradient(ellipse 90% 34% at 65% 92%,rgba(113,61,160,.12),transparent 80%),
    linear-gradient(160deg,#201826 0%,#17131f 52%,#141018 100%)!important;
  background-attachment:fixed!important;
}
.shell{max-width:520px;padding:19px 18px calc(122px + env(safe-area-inset-bottom,0px))}

.small,.muted,.aur-subtitle,.aur-ai-note{color:var(--muted)!important}

.top{margin-bottom:23px;align-items:center}
.logo-icon{height:50px;width:50px;flex:0 0 50px;border-radius:17px;color:#fee4fd;
 background:radial-gradient(circle at 28% 15%,#e9acecbb,transparent 52%),linear-gradient(145deg,#613b75,#9b4caf 56%,#3a305e);
 font-size:30px;box-shadow:inset 0 1px 1px #ffffff58,0 7px 22px #a25cbb3f;border:1px solid #e5adee66}
.logo strong{font-size:20px;font-weight:800;letter-spacing:-.7px}
.logo small{font-size:11px;color:#c3b6cc;letter-spacing:-.15px}
.aur-brand-accent{color:#f4b3f3!important}

.aur-top-right{display:flex;align-items:center;gap:9px}

.night-welcome:before{content:"";position:absolute;z-index:-1;inset:25% -25% -23% 15%;pointer-events:none;
 background:radial-gradient(ellipse at 85% 55%,#dd79d57d,transparent 37%),radial-gradient(ellipse at 66% 78%,#8c69ec66,transparent 43%);
 filter:blur(18px);transform:rotate(-11deg)}
.night-welcome:after{content:"";position:absolute;z-index:-1;right:-22px;bottom:8px;width:60%;height:45px;
 border-top:2px solid rgba(255,207,255,.62);transform:rotate(-15deg);border-radius:55% 50% 0 0;filter:drop-shadow(0 0 13px #dd8ff3)}
.night-hello{font-size:10px;letter-spacing:1.7px;color:#df9ddd;font-weight:800;margin-bottom:20px}
.night-hello span{color:#ffe0ff;padding-left:5px}

 align-items:flex-start;flex-direction:column;text-align:left;box-shadow:inset 0 1px 1px #ffffff20,0 11px 28px #08051033;

<script>
(function auroraIntro(){
  var intro=document.getElementById('aurora-splash');
  function finish(){
    if(!intro||intro.classList.contains('is-leaving'))return;
    intro.classList.add('is-leaving');
    intro.setAttribute('aria-hidden','true');
    setTimeout(function(){if(intro&&intro.parentNode)intro.remove()},620);
  }
  // Intentional two-second launch animation. Never block the app on API replies.
  setTimeout(finish,2050);
  // Fallback for scripts or WebViews with delayed rendering.
  window.addEventListener('pageshow',function(e){if(e.persisted)finish()});
})();
</script>

'use strict';

/* Aurora Business: prevent accidental page/text zoom on iPhone Telegram.
   Keep native scrolling and selection/editing inside text fields. */
(function preventInAppZoom(){
  const prevent=e=>{if(e.cancelable)e.preventDefault();};
  for(const eventName of ['gesturestart','gesturechange','gestureend']){
    document.addEventListener(eventName,prevent,{passive:false,capture:true});
  }
  document.addEventListener('touchmove',e=>{
    if(e.touches.length>1)prevent(e);
  },{passive:false,capture:true});
  let lastTapTime=0;
  document.addEventListener('touchend',e=>{
    if(e.changedTouches.length!==1)return;
    const element=e.target instanceof Element?e.target:null;
    if(element?.closest('input,textarea,select,[contenteditable]')){
      lastTapTime=0;
      return; // Keep cursor placement, native copy/paste and text selection.
    }
    const now=Date.now();
    if(now-lastTapTime<300){
      prevent(e);
      lastTapTime=0;
    }else{
      lastTapTime=now;
    }
  },{passive:false,capture:true});
  document.addEventListener('dblclick',e=>{
    const element=e.target instanceof Element?e.target:null;
    if(!element?.closest('input,textarea,select,[contenteditable]'))prevent(e);
  },{passive:false,capture:true});
})();

const API='https://aurora-ai.artykartunov.workers.dev';
const tg=window.Telegram?.WebApp||null;
try{tg?.ready();tg?.expand();tg?.disableVerticalSwipes?.();tg?.setHeaderColor?.('#211b29')}catch{}
const user=tg?.initDataUnsafe?.user||null;
// Aurora Business 2.4.1: protect the top of the page in Telegram fullscreen.
// Some iOS Telegram builds report zero safe-area insets or delay isFullscreen.
// Detect the fullscreen webview too; never add this offset in the normal Mini App sheet.
let auroraFullscreenDetected=false;
function auroraSyncTelegramSafeArea(){
  const contentTop=Math.max(0,Number(tg?.contentSafeAreaInset?.top)||0);
  const systemTop=Math.max(0,Number(tg?.safeAreaInset?.top)||0);
  const screenHeight=Math.max(Number(window.screen?.height)||0,Number(window.screen?.availHeight)||0);
  // innerHeight is a layout viewport: unlike visualViewport.height it normally
  // remains stable while the keyboard is visible on iOS.
  const layoutHeight=Number(window.innerHeight)||0;
  const fillsScreen=!!tg && screenHeight>0 && layoutHeight>=screenHeight-100;
  const nativeFullscreen=!!tg?.isFullscreen;
  const insetShowsOverlay=!!tg && (contentTop>=48 || systemTop>=48);
  if(nativeFullscreen||fillsScreen||insetShowsOverlay)auroraFullscreenDetected=true;
  // Telegram's native Close/Menu pill occupies more than the iPhone status bar.
  // Reserve at least 84 CSS px above our brand header in fullscreen.
  const extra=auroraFullscreenDetected?Math.max(84,contentTop,systemTop):0;
  document.documentElement.style.setProperty('--aur-tg-top',Math.min(160,Math.round(extra))+'px');
}
auroraSyncTelegramSafeArea();
try{
  tg?.onEvent?.('safeAreaChanged',auroraSyncTelegramSafeArea);
  tg?.onEvent?.('contentSafeAreaChanged',auroraSyncTelegramSafeArea);
  tg?.onEvent?.('fullscreenChanged',auroraSyncTelegramSafeArea);
  tg?.onEvent?.('viewportChanged',auroraSyncTelegramSafeArea);
}catch{}
window.addEventListener('resize',auroraSyncTelegramSafeArea,{passive:true});
requestAnimationFrame(auroraSyncTelegramSafeArea);
setTimeout(auroraSyncTelegramSafeArea,350);
setTimeout(auroraSyncTelegramSafeArea,1100);

const USER_KEY='aurora-studio-v18-'+String(user?.id||'browser');
const $=id=>document.getElementById(id);

// Hide the fixed navigation while the iOS/Telegram keyboard is being used.
function aurEditable(el){
  return el instanceof Element && Boolean(el.closest('input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),textarea,select,[contenteditable="true"]'));
}
function aurUpdateKeyboard(){
  const focused=aurEditable(document.activeElement);
  const vv=window.visualViewport;
  const hiddenHeight=vv?Math.max(0,window.innerHeight-vv.height-vv.offsetTop):0;
  document.documentElement.classList.toggle('aur-keyboard-open',focused||hiddenHeight>130);
}
document.addEventListener('focusin',e=>{if(aurEditable(e.target))document.documentElement.classList.add('aur-keyboard-open')});
document.addEventListener('focusout',()=>{requestAnimationFrame(aurUpdateKeyboard);setTimeout(aurUpdateKeyboard,120)});
window.visualViewport?.addEventListener('resize',aurUpdateKeyboard);
window.visualViewport?.addEventListener('scroll',aurUpdateKeyboard);
window.addEventListener('resize',aurUpdateKeyboard);

async function api(path,payload={}){
 if(!tg?.initData)throw Error('Открой Аврору через Telegram-бота, не в обычном браузере.');
 const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,...payload})});
 const data=await r.json().catch(()=>({error:'Неизвестный ответ сервера'}));
 if(!r.ok)throw Error(data.error||`HTTP ${r.status}`);
 if(state.plan?.plan!=='pro'&&state.plan?.quotas?.used){
  const section=path==='/assistant/send'||path==='/chat'?'agent':
   path==='/studio/images/generate'?'photo':path==='/business/generate'?'description':
   path==='/studio/write'?(payload.kind==='card'?'card':'writer'):null;
  if(section)state.plan.quotas.used[section]=(Number(state.plan.quotas.used[section])||0)+1;
 }
 return data;
}
function saveLocal(){try{localStorage.setItem(USER_KEY,JSON.stringify({folders:state.folders,projects:state.projects.slice(0,350),planner:state.planner,plannerRevision:state.plannerRevision,plannerDirty:state.plannerDirty,finance:state.finance}))}catch{}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(USER_KEY)||'{}');state.folders=Array.isArray(d.folders)?d.folders:[];state.projects=Array.isArray(d.projects)?d.projects:[];if(d.planner){state.planner.tasks=Array.isArray(d.planner.tasks)?d.planner.tasks.slice(0,100):[];state.planner.notes=Array.isArray(d.planner.notes)?d.planner.notes.slice(0,50):[]}state.plannerRevision=typeof d.plannerRevision==='string'?d.plannerRevision:null;state.plannerDirty=!!d.plannerDirty;if(d.finance&&typeof d.finance==='object')state.finance={...state.finance,...d.finance}}catch{}}
function id(){return crypto.randomUUID?.()||'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>(c==='x'?Math.random()*16|0:(Math.random()*4|8)).toString(16))}
async function cacheOpen(){return new Promise((resolve,reject)=>{const q=indexedDB.open('AuroraStudioImages',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('images'))q.result.createObjectStore('images')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function cacheSet(key,value){if(!value)return;try{const db=await cacheOpen();await new Promise((ok,no)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(value,key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});db.close()}catch(e){console.warn('Cache',e)}}
async function cacheGet(key){try{const db=await cacheOpen();const val=await new Promise((ok,no)=>{const tx=db.transaction('images');const q=tx.objectStore('images').get(key);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>no(q.error)});db.close();return val}catch{return null}}
async function cacheDelete(key){try{const db=await cacheOpen();await new Promise((ok,no)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').delete(key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});db.close()}catch{}}
function imageLoad(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(Error('Не удалось прочитать фото'));im.src=src})}
function blobOf(canvas,type,quality){return new Promise(ok=>canvas.toBlob(ok,type,quality))}
async function dataOf(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('Не удалось прочитать файл'));r.readAsDataURL(blob)})}
async function squeeze(source,maxBytes=350000,maxSide=1050){
 const image=await imageLoad(source);
 for(let side=maxSide;side>=440;side=Math.floor(side*.82)){
  const ratio=Math.min(1,side/Math.max(image.naturalWidth,image.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(image.naturalHeight*ratio));
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
  for(const q of [.82,.7,.58,.45,.32]){const blob=await blobOf(canvas,'image/jpeg',q);if(blob&&blob.size<=maxBytes)return dataOf(blob)}
 }
 throw Error('Не удалось сжать фото до 350 КБ');
}
async function cropImage(source,ratio){const target={'1:1':1,'4:5':.8,'9:16':9/16}[ratio];if(!target)return source;const im=await imageLoad(source);const c=document.createElement('canvas');const sw=im.naturalWidth,sh=im.naturalHeight;let w=sw,h=sh;if(sw/sh>target)w=Math.round(sh*target);else h=Math.round(sw/target);c.width=w;c.height=h;c.getContext('2d').drawImage(im,Math.round((sw-w)/2),Math.round((sh-h)/2),w,h,0,0,w,h);return c.toDataURL('image/png')}
async function fileData(file,max=9000000){if(!file||file.size>max||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Нужно JPG, PNG или WEBP до 9 МБ');return dataOf(file)}
async function projectImage(p){let photo=await cacheGet(p.id);if(!photo&&p.imageKey&&state.synced){try{photo=(await api('/studio/images/get',{imageKey:p.imageKey})).image;if(validImage(photo))await cacheSet(p.id,photo)}catch{}}return validImage(photo)?photo:null}
async function saveProject(kind,title,content,fullImage=null,existingId=null){
 const projectId=existingId||id();const previous=state.projects.find(p=>p.id===projectId);
 if(fullImage)await cacheSet(projectId,fullImage);
 let imageKey=previous?.imageKey||null;
 if(fullImage&&state.synced&&!imageKey){
  try{const compressed=await squeeze(fullImage);const response=await api('/studio/images/save',{image:compressed});imageKey=response.imageKey||null}
  catch(e){notice('Фото только на устройстве: '+e.message)}
 }
 const p={id:projectId,kind,title:String(title||'Без названия').slice(0,120),folderId:previous?.folderId||(state.folder==='all'?'':state.folder),content:content||{},imageKey,createdAt:previous?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
 if(state.synced){try{const response=await api('/studio/projects/save',{project:p});p.id=response.id||p.id}catch(e){notice('Проект пока локальный: '+e.message)}}
 const i=state.projects.findIndex(x=>x.id===p.id);if(i<0)state.projects.unshift(p);else state.projects[i]=p;saveLocal();return p;
}

 if(m.mediaType==='video'){

let plannerSaving=null;
function plannerLocalChange(){state.plannerDirty=true;state.plannerStatus=tg?.initData?'saving':'local';saveLocal();render();void plannerSaveCloud()}
async function plannerLoadCloud(){
 if(!tg?.initData)return;
 try{
  const remote=await api('/planner/load');
  if(remote.planner){
   if(state.plannerDirty){
    // The local copy may contain offline edits: preserve it until the user chooses.
    state.plannerRemote=remote;state.plannerStatus='conflict';
   }else{
    state.planner=remote.planner;state.plannerRevision=remote.revision;state.plannerRemote=null;state.plannerStatus='online';saveLocal();
   }
  }else{
   state.plannerRevision=null;state.plannerRemote=null;
   if(state.planner.tasks.length||state.planner.notes.length){state.plannerDirty=true;await plannerSaveCloud()}
   else{state.plannerDirty=false;state.plannerStatus='online';saveLocal()}
  }
 }catch(e){state.plannerStatus='local';console.warn('Planner offline:',e.message)}
 if(state.page==='planner')render();
}
async function plannerSaveCloud(){
 if(!tg?.initData){state.plannerStatus='local';return}
 if(plannerSaving)return plannerSaving;
 plannerSaving=(async()=>{
  while(state.plannerDirty && state.plannerStatus!=='conflict'){
   const revision=state.plannerRevision;
   const snapshot=JSON.stringify(state.planner);
   try{
    const result=await api('/planner/save',{planner:JSON.parse(snapshot),revision});
    state.plannerRevision=result.revision;
    if(JSON.stringify(state.planner)===snapshot){state.plannerDirty=false;state.plannerStatus='online'}
    else{state.plannerStatus='saving'}
    saveLocal();
   }catch(e){
    if(String(e.message).includes('другом устройстве')||String(e.message).includes('Устаревшая версия')){
     state.plannerStatus='conflict';
     try{state.plannerRemote=await api('/planner/load')}catch{}
    } else state.plannerStatus='local';
    console.warn('Planner sync:',e.message);break;
   }
  }
  if(state.page==='planner')render();
 })();
 try{await plannerSaving}finally{plannerSaving=null}
}
function plannerDateLabel(v){
 if(!v)return '';
 const now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
 if(v===today)return 'Сегодня';
 const d=new Date(v+'T12:00:00');return Number.isNaN(d.valueOf())?v:d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function plannerDownloadBackup(){
 const payload={app:'Aurora Business',version:2,exportedAt:new Date().toISOString(),planner:state.planner};
 const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));
 download(url,'aurora-planner-backup.json');setTimeout(()=>URL.revokeObjectURL(url),120000);
}
async function plannerImportBackup(file){
 if(!file||file.size>230000)throw Error('Резервная копия должна быть не больше 230 КБ');
 const data=JSON.parse(await file.text());
 const p=data?.planner;
 if(!p||!Array.isArray(p.tasks)||!Array.isArray(p.notes)||p.tasks.length>100||p.notes.length>50)throw Error('Неверный формат резервной копии');
 const tasks=p.tasks.map(x=>({id:/^[a-z0-9_-]{6,80}$/i.test(String(x.id||''))?x.id:id(),text:String(x.text||'').slice(0,180),done:!!x.done,dueDate:/^\d{4}-\d{2}-\d{2}$/.test(x.dueDate||'')?x.dueDate:'',priority:x.priority==='high'?'high':'normal'}));
 const notes=p.notes.map(x=>({id:/^[a-z0-9_-]{6,80}$/i.test(String(x.id||''))?x.id:id(),text:String(x.text||'').slice(0,3000),createdAt:typeof x.createdAt==='string'?x.createdAt.slice(0,40):new Date().toISOString()}));
 if(tasks.some(x=>!x.text.trim())||notes.some(x=>!x.text.trim()))throw Error('В резервной копии есть пустые записи');
 if(!await uiConfirm(`Заменить текущие задачи (${state.planner.tasks.length}) и заметки (${state.planner.notes.length}) данными из файла?`))return;
 state.planner={tasks,notes};state.plannerDirty=true;
 if(state.plannerStatus==='conflict'){state.plannerStatus='local'}
 saveLocal();render();void plannerSaveCloud();notice('Резервная копия импортирована');
}

async function photoLocalCanvas(){
 if(!state.photoReference)throw Error('Сначала добавь фотографию');
 const im=await imageLoad(state.photoReference),ratio=photoSizeRatio(),long=1440;
 let outWidth,outHeight;
 if(ratio>=.8){outWidth=1080;outHeight=Math.round(outWidth/ratio)}
 else {outHeight=1920;outWidth=Math.round(outHeight*ratio)}
 const canvas=document.createElement('canvas');canvas.width=outWidth;canvas.height=outHeight;
 const ctx=canvas.getContext('2d');if(!ctx)throw Error('Не удалось подготовить изображение');
 const frame=photoFrame(),framePad=frame==='none'?0:Math.round(Math.min(outWidth,outHeight)*.055);
 ctx.fillStyle=frame==='lilac'?'#eee5f5':'#fcfaf9';ctx.fillRect(0,0,outWidth,outHeight);
 const areaW=outWidth-framePad*2,areaH=outHeight-framePad*2;
 const sourceWidth=im.naturalWidth,sourceHeight=im.naturalHeight,targetRatio=areaW/areaH;
 let cropW=sourceWidth,cropH=sourceHeight;
 if(sourceWidth/sourceHeight>targetRatio)cropW=sourceHeight*targetRatio;
 else cropH=sourceWidth/targetRatio;
 ctx.save();ctx.filter=photoStyle();ctx.drawImage(im,(sourceWidth-cropW)/2,(sourceHeight-cropH)/2,cropW,cropH,framePad,framePad,areaW,areaH);ctx.restore();
 return canvas;
}

function auroraActionIntent(s){
 const text=String(s||'').trim();
 if(/^(?:как|почему|где|что|можно ли)\s/i.test(text))return null;
 if(!/(?:^|[\s«"'(])(?:создай|создать|создайте|сделай|сделать|сделайте|напиши|написать|напишите|подготовь|подготовить|сгенерируй|сгенерируйте|оформи|оформить|обработай|улучши|отредактируй)(?=\s|$|[!.,:])/i.test(text))return null;
 if(/(?:видео|ролик|рилс|reel|story\s*video|клип)/i.test(text))return 'video';
 if(/карточк[а-яё]*\s*(?:товар[а-яё]*|продукт[а-яё]*|для|на)|товарн[а-яё]*\s+карточк[а-яё]*/i.test(text))return 'card';
 if(/(?:фото|фотограф|изображени|картинк|баннер|обложк|афиш|снимок)/i.test(text))return 'photo';
 if(/(?:описани[а-яё]*|текст\s+для\s+(?:товар[а-яё]*|карточк[а-яё]*))/i.test(text)&&/(?:товар|продукт|маркетплейс|ozon|wildberries|карточк)/i.test(text))return 'description';
 if(/(?:пост[а-яё]*|реклам[а-яё]*\s+текст|сео\s*текст|seo\s*текст|заголовк[а-яё]*)/i.test(text))return 'writer';
 return null;
}
function auroraToolDetails(message,kind){
 let text=String(message||'').trim();
 if(kind==='card')text=text.replace(/^.*?(?:карточк[а-яё]*\s*(?:товар[а-яё]*|продукт[а-яё]*)?|товарн[а-яё]*\s+карточк[а-яё]*)\s*(?:для|о|на)?\s*/i,'');
 else if(kind==='description')text=text.replace(/^.*?описани[а-яё]*\s*(?:для|о|на)?\s*/i,'');
 else if(kind==='photo')text=text.replace(/^.*?(?:создай|сделай|сгенерируй|обработай|улучши|отредактируй)\s*(?:ai[-\s]*)?(?:фото|фотографию|изображение|картинку|баннер|афишу)?\s*(?:для|с|на)?\s*/i,'');
 else if(kind==='video')text=text.replace(/^.*?(?:создай|сделай|сгенерируй|подготовь)\s*(?:короткое\s*)?(?:ai[-\s]*)?(?:видео|ролик|рилс|клип)?\s*(?:для|с|на)?\s*/i,'');
 else text=text.replace(/^(?:создай|сделай|напиши|подготовь|сгенерируй|оформи)\s+/i,'');
 return text.replace(/^[\s:—–,-]+/,'').trim();
}
