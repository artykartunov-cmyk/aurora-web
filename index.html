<script>
async function createAlbum() {
  const name = await askAuroraAlbumName();
  if (!name || !name.trim()) return;

  const albums = JSON.parse(
    localStorage.getItem("aurora_demo_albums") || "[]"
  );

  albums.push(name.trim());

  localStorage.setItem(
    "aurora_demo_albums",
    JSON.stringify(albums)
  );

  showAlbums();
}

function showAlbums() {
  const albums = JSON.parse(
    localStorage.getItem("aurora_demo_albums") || "[]"
  );

  const empty = document.querySelector("#gallery .empty");
  if (!empty) return;

  if (!albums.length) {
      empty.textContent = "Пока нет альбомов";
      return;
    }

  empty.replaceChildren();

  albums.forEach(name => {
    const item = document.createElement("div");
    item.textContent = "📁 " + name;
    item.style.cssText =
      "padding:18px;margin:12px 0;background:#20212d;border-radius:14px;color:white";
    item.style.cursor = "pointer";
    
item.onclick = () => {
  window.activeAlbum = name;

const addBtn = document.getElementById("addAlbumPhoto");
if (addBtn) addBtn.style.display = "block";

    auroraRenderAlbum(name);
};

    const removeAlbum = document.createElement("button");
    removeAlbum.type = "button";
    removeAlbum.textContent = "✕";
    removeAlbum.title = "Удалить альбом";
    removeAlbum.setAttribute("aria-label", "Удалить альбом");

    item.style.position = "relative";
    item.style.paddingRight = "48px";

    removeAlbum.style.cssText =
      "position:absolute;top:5px;right:5px;" +
      "width:28px;height:28px;border-radius:50%;" +
      "border:0;background:#3a284acc;color:white;" +
      "font-size:17px;cursor:pointer;padding:0;" +
      "display:flex;align-items:center;" +
      "justify-content:center";

    removeAlbum.onclick = async (event) => {
      event.stopPropagation();
      if (!await auroraConfirmDelete("album", name)) return;

      try {
        await auroraRemoveAlbum(name);
      } catch (e) {
        alert("Ошибка удаления: " + e.message);
      }
    };

    item.appendChild(removeAlbum);
    empty.appendChild(item);
  });
}

document.addEventListener("DOMContentLoaded", showAlbums);
</script>

// AURORA_SAVE_CONNECTED_V1
async function previewPhotos(files) {
  const album = window.activeAlbum || "Мои фото";
  let container = document.getElementById("photoPreview");

  if (!container) {
    container = document.createElement("div");
    container.id = "photoPreview";
    container.style.cssText =
      "padding:15px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px";
    document.querySelector("#gallery").appendChild(container);
  }

  container.replaceChildren();

  for (const file of files) {
    await saveAuroraPhoto(album, file);
  }

  await auroraRenderAlbum(album);
  return;

  for (const file of files) {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    img.style.cssText =
      "width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px";
    img.onload = () => URL.revokeObjectURL(img.src);
    container.appendChild(img);
  }

  alert("Фото выбраны для альбома: " + album);
}
</script>

<script>
// AURORA_PHOTO_STORAGE_V1
const photoDB = new Promise((resolve, reject) => {
  const request = indexedDB.open("AuroraPhotos", 1);

  request.onupgradeneeded = () => {
    const db = request.result;
    if (!db.objectStoreNames.contains("photos")) {
      db.createObjectStore("photos", {
        keyPath: "id",
        autoIncrement: true
      });
    }
  };

  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});

async function saveAuroraPhoto(album, file) {
  const db = await photoDB;

  return new Promise((resolve, reject) => {
    const tx = db.transaction("photos", "readwrite");

    tx.objectStore("photos").add({
      album: album,
      file: file,
      created: Date.now()
    });

    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function loadAuroraPhotos(album) {
  const db = await photoDB;

  return new Promise((resolve, reject) => {
    const tx = db.transaction("photos", "readonly");
    const request = tx.objectStore("photos").getAll();

    request.onsuccess = () => {
      resolve(request.result.filter(p => p.album === album));
    };

    request.onerror = () => reject(request.error);
  });
}

async function displayAuroraPhotos(album) {
  const container = document.getElementById("photoPreview");
  if (!container) return;

  const photos = await loadAuroraPhotos(album);
  container.replaceChildren();

  for (const photo of photos) {
    const img = document.createElement("img");
    const url = URL.createObjectURL(photo.file);

    img.src = url;
    img.style.cssText =
      "width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px";

    img.onload = () => URL.revokeObjectURL(url);
    container.appendChild(img);
  }
}
</script>

<script>
// AURORA_DELETE_TOOLS_V1

async function auroraRecords(album) {
  const db = await photoDB;

  return new Promise((resolve, reject) => {
    const found = [];
    const tx = db.transaction("photos", "readonly");
    const request = tx.objectStore("photos").openCursor();

    request.onsuccess = () => {
      const cursor = request.result;
      if (!cursor) return;

      if (cursor.value.album === album) {
        found.push({
          key: cursor.primaryKey,
          file: cursor.value.file
        });
      }
      cursor.continue();
    };

    tx.oncomplete = () => resolve(found);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function auroraRenderAlbum(album) {
  const container = document.getElementById("photoPreview");
  if (!container) return;

  const records = await auroraRecords(album);
  if (window.activeAlbum !== album) return;

  container.replaceChildren();

  for (const record of records) {
    const tile = document.createElement("div");
    tile.style.cssText = "position:relative;min-width:0";

    const img = document.createElement("img");
    const url = URL.createObjectURL(record.file);

    img.src = url;
    img.style.cssText =
      "width:100%;aspect-ratio:1;" +
      "object-fit:cover;border-radius:12px;display:block";

    img.onload = () => URL.revokeObjectURL(url);
    img.onerror = () => URL.revokeObjectURL(url);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "✕";
    remove.title = "Удалить фотографию";
    remove.setAttribute("aria-label", "Удалить фотографию");

    remove.style.cssText =
      "position:absolute;top:5px;right:5px;" +
      "width:28px;height:28px;border-radius:50%;" +
      "border:0;background:#3a284acc;color:white;" +
      "font-size:17px;cursor:pointer";

    remove.onclick = async (event) => {
      event.stopPropagation();

      if (!await auroraConfirmDelete("photo")) return;

      try {
        const db = await photoDB;

        await new Promise((resolve, reject) => {
          const tx = db.transaction("photos", "readwrite");
          tx.objectStore("photos").delete(record.key);

          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        });

        await auroraRenderAlbum(album);
      } catch (e) {
        alert("Ошибка удаления фото: " + e.message);
      }
    };

    tile.append(img, remove);
    container.appendChild(tile);
  }
}

async function auroraRemoveAlbum(album) {
  const db = await photoDB;

  await new Promise((resolve, reject) => {
    const tx = db.transaction("photos", "readwrite");
    const request = tx.objectStore("photos").openCursor();

    request.onsuccess = () => {
      const cursor = request.result;
      if (!cursor) return;

      if (cursor.value.album === album) {
        cursor.delete();
      }
      cursor.continue();
    };

    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });

  const albums = JSON.parse(
    localStorage.getItem("aurora_demo_albums") || "[]"
  );

  localStorage.setItem(
    "aurora_demo_albums",
    JSON.stringify(albums.filter(x => x !== album))
  );

  if (window.activeAlbum === album) {
    window.activeAlbum = null;

    document.getElementById("photoPreview")
      ?.replaceChildren();

    const button = document.getElementById("addAlbumPhoto");
    if (button) button.style.display = "none";
  }

  showAlbums();
}

<script>
const AURORA_NOTES_KEY = "aurora_notes_v1";
let auroraEditingNote = null;

function auroraNotesGet() {
  try {
    const data = JSON.parse(
      localStorage.getItem(AURORA_NOTES_KEY) || "[]"
    );
    return Array.isArray(data) ? data : [];
  } catch (e) {
    return [];
  }
}

function auroraNotesRender() {
  const list = document.getElementById("auroraNotesList");
  if (!list) return;

  const query = document.getElementById("auroraNotesSearch")
    ?.value.toLowerCase().trim() || "";

  const notes = auroraNotesGet()
    .filter(n => (
      (n.title || "") + " " + (n.text || "")
    ).toLowerCase().includes(query))
    .sort((a,b) => b.updated - a.updated);

  list.replaceChildren();

  if (!notes.length) {
    const empty = document.createElement("p");
    empty.className = "sub";
    empty.textContent = query
      ? "Ничего не найдено"
      : "Пока нет заметок. Создай первую ✨";
    list.appendChild(empty);
    return;
  }

  notes.forEach(note => {
    const card = document.createElement("div");
    card.className = "aurora-note-card";

    const title = document.createElement("strong");
    title.textContent = note.title || "Без названия";

    const preview = document.createElement("p");
    preview.textContent = (note.text || "").slice(0,120);

    const date = document.createElement("small");
    date.textContent = new Date(note.updated)
      .toLocaleDateString("ru-RU");

    const trash = document.createElement("button");
    trash.className = "aurora-note-trash";
    trash.textContent = "×";
    trash.setAttribute("aria-label", "Удалить заметку");

    trash.onclick = async e => {
      e.stopPropagation();

      if (!await auroraConfirmNoteDelete()) return;

      const remaining = auroraNotesGet()
        .filter(n => n.id !== note.id);

      localStorage.setItem(
        AURORA_NOTES_KEY, JSON.stringify(remaining)
      );
      auroraNotesRender();
    };

    card.onclick = () => auroraNoteOpen(note.id);
    card.append(title, preview, date, trash);
    list.appendChild(card);
  });
}

function auroraNoteOpen(id = null) {
  const note = auroraNotesGet().find(n => n.id === id);
  auroraEditingNote = note ? note.id : null;

  document.getElementById("auroraNoteHeading")
    .textContent = note ? "Редактировать" : "Новая заметка";

  document.getElementById("auroraNoteTitle")
    .value = note?.title || "";

  document.getElementById("auroraNoteText")
    .value = note?.text || "";

  document.getElementById("auroraNoteEditor")
    .classList.add("open");
}

function auroraNoteClose() {
  document.getElementById("auroraNoteEditor")
    .classList.remove("open");
}

document.getElementById("auroraNoteForm")
  .addEventListener("submit", e => {
    e.preventDefault();

    const title = document.getElementById("auroraNoteTitle")
      .value.trim();
    const text = document.getElementById("auroraNoteText")
      .value.trim();

    if (!title && !text) {
      alert("Напиши название или текст заметки.");
      return;
    }

    const notes = auroraNotesGet();
    const previous = notes.find(
      n => n.id === auroraEditingNote
    );

    const updated = {
      id: previous?.id ||
        String(Date.now()) + Math.random(),
      title, text,
      updated: Date.now()
    };

    const result = previous
      ? notes.map(n => n.id === previous.id ? updated : n)
      : [...notes, updated];

    try {
      localStorage.setItem(
        AURORA_NOTES_KEY, JSON.stringify(result)
      );
      auroraNoteClose();
      auroraNotesRender();
    } catch (err) {
      alert("Не удалось сохранить заметку.");
    }
  });
</script>

      <div class="aurora-note-del-panel"
        role="alertdialog" aria-modal="true"
        aria-labelledby="noteDelTitle">
        <div class="aurora-note-del-icon">
          <svg width="32" height="32"
            viewBox="0 0 24 24"
            fill="none" stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M3 6h18"/>
            <path d="M8 6V4h8v2"/>
            <path d="M5 6l1 15h12l1-15"/>
            <path d="M10 10v7M14 10v7"/>
          </svg>
        </div>

        <h2 id="noteDelTitle">Удалить заметку?</h2>
        <p>Заметка будет удалена без
        возможности восстановления.</p>

        <div class="aurora-note-del-buttons">
          <button type="button"
            class="aurora-note-del-cancel">
            Отмена
          </button>
          <button type="button"
            class="aurora-note-del-confirm">
            Удалить
          </button>
        </div>
      </div>`;

    document.body.appendChild(overlay);

    function onKey(e) {
      if (e.key === "Escape") finish(false);
    }

    function finish(value) {
      document.removeEventListener("keydown", onKey);
      overlay.remove();
      resolve(value);
    }

    overlay.querySelector(".aurora-note-del-cancel")
      .onclick = () => finish(false);

    overlay.querySelector(".aurora-note-del-confirm")
      .onclick = () => finish(true);

    overlay.onclick = e => {
      if (e.target === overlay) finish(false);
    };

    document.addEventListener("keydown", onKey);

    overlay.querySelector(".aurora-note-del-cancel")
      .focus();
  });
}
</script>

<script>

(() => {

  const card = [...document.querySelectorAll('#home .card')]

    .find(el =>

      el.querySelector('strong')?.textContent.trim() === 'Мои дела'

    );

  if (!card || document.getElementById('auroraCalculator')) return;

  card.querySelector('strong').textContent = 'Калькулятор';

  card.querySelector('small').textContent = 'Быстрые вычисления';

  card.querySelector('.aurora-icon').innerHTML =

    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg>';

  const page = document.createElement('section');

  page.id = 'auroraCalculator';

  page.className = 'hidden';

  page.innerHTML = `

    <button type="button" class="back" id="calcBack">

      ← На главную

    </button>

    <h1>Калькулятор</h1>

    <p class="sub">Считай легко ✨</p>

    <div class="calc-box">

      <div class="calc-history" id="calcHistory"></div>

      <output class="calc-screen" id="calcScreen">0</output>

      <div class="calc-pad" id="calcPad"></div>

    </div>`;

  document.querySelector('main').appendChild(page);

  const keys = [

    'AC','±','%','÷',

    '7','8','9','×',

    '4','5','6','−',

    '1','2','3','+',

    '⌫','0','.','='

  ];

  const pad = page.querySelector('#calcPad');

  keys.forEach(key => {

    const button = document.createElement('button');

    button.type = 'button';

    button.textContent = key;

    button.dataset.key = key;

    button.className =

      ['+','−','×','÷'].includes(key) ? 'op'

      : key === '=' ? 'equal'

      : ['AC','±','%','⌫'].includes(key) ? 'tool' : '';

    pad.appendChild(button);

  });

  const previousOpenPage = window.openPage;

  window.openPage = function(id) {

    previousOpenPage(id);

    page.classList.toggle('hidden', id !== 'auroraCalculator');

  };

  card.onclick = () => openPage('auroraCalculator');

  page.querySelector('#calcBack').onclick =

    () => openPage('home');

  let value = '0';

  let saved = null;

  let operator = null;

  let startNew = false;

  const screen = page.querySelector('#calcScreen');

  const history = page.querySelector('#calcHistory');

  const isOperator = key =>

    ['+','−','×','÷'].includes(key);

  function compute(a, b, op) {

    let result =

      op === '+' ? a+b :

      op === '−' ? a-b :

      op === '×' ? a*b :

      b === 0 ? NaN : a/b;

    return Number.isFinite(result)

      ? Number(result.toPrecision(12))

      : null;

  }

  function render() {

    screen.textContent = value;

    history.textContent =

      operator !== null ? saved+' '+operator : '';

  }

  pad.onclick = event => {

    const button = event.target.closest('button');

    if (!button) return;

    const key = button.dataset.key;

    if (key === 'AC') {

      value='0';

      saved=null;

      operator=null;

      startNew=false;

    } else if (key === '⌫') {

      value = startNew || value === 'Ошибка'

        ? '0' : value.slice(0,-1) || '0';

      if (value === '-') value='0';

      startNew=false;

    } else if (key === '±') {

      if (value !== '0' && value !== 'Ошибка')

        value = value.startsWith('-')

          ? value.slice(1) : '-'+value;

    } else if (key === '%') {

      if (value !== 'Ошибка')

        value = String(Number(value)/100);

    } else if (key === '.') {

      if (startNew || value === 'Ошибка') {

        value='0.';

        startNew=false;

      } else if (!value.includes('.')) value+='.'

    } else if (/^[0-9]$/.test(key)) {

      if (startNew || value === 'Ошибка') {

        value=key;

        startNew=false;

      } else if (value.replace(/[^0-9]/g,'').length < 13) {

        value = value === '0' ? key : value+key;

      }

    } else if (isOperator(key)) {

      if (value === 'Ошибка') return;

      if (operator !== null && saved !== null && !startNew) {

        const result=compute(saved,Number(value),operator);

        if (result === null) {

          value='Ошибка';

          saved=null;

          operator=null;

          startNew=true;

          render();

          return;

        }

        value=String(result);

      }

      saved=Number(value);

      operator=key;

      startNew=true;

    } else if (key === '=' && operator !== null && saved !== null) {

      const result=compute(saved,Number(value),operator);

      value=result === null ? 'Ошибка' : String(result);

      saved=null;

      operator=null;

      startNew=true;

    }

    render();

  };

  render();

})();

</script>

      <div class="fin-balance" id="finBalance">0 ₽</div>

      <div class="fin-label">

        Доходы и расходы за выбранный период

      </div>

      <div class="fin-cols">

        <div class="fin-stat">

          <span class="fin-label">↑ Доходы</span>

          <b class="fin-income" id="finIncome">0 ₽</b>

        </div>

        <div class="fin-stat">

          <span class="fin-label">↓ Расходы</span>

          <b class="fin-expense" id="finExpense">0 ₽</b>

        </div>

      </div>

    </div>

    <form class="fin-panel" id="finForm">

      <h2 style="font-size:19px;margin:0 0 10px">

        ＋ Новая операция

      </h2>

      <label class="fin-field">

        Тип

        <select id="finType">

          <option value="expense">Расход</option>

          <option value="income">Доход</option>

        </select>

      </label>

      <label class="fin-field">

        Сумма (₽)

        <input id="finValue" type="text"

          inputmode="decimal"

          placeholder="Например, 1250,50"

          required maxlength="14">

      </label>

      <label class="fin-field">

        Категория

        <select id="finCategory"></select>

      </label>

        Дата

      </label>

        Комментарий (необязательно)

          placeholder="Например, продукты">

      </label>

      <button class="fin-save" type="submit">

        Сохранить операцию

      </button>

    </form>

    <div class="fin-panel">

      <div class="fin-head">

        <h2>История</h2>

        <select id="finPeriod" aria-label="Период">

          <option value="month">Этот месяц</option>

          <option value="all">Всё время</option>

        </select>

      <div id="finHistory"></div>

    </div>

  `;

  main.appendChild(page);

  const oldOpenPage = window.openPage;

  window.openPage = function(name) {

    if (typeof oldOpenPage === 'function') {

      oldOpenPage(name);

    }

    page.classList.toggle(

      'hidden', name !== 'auroraFinance'

    );

  };

  tile.addEventListener('click', () => {

  page.querySelector('#finBack')

    });

  const get = id => page.querySelector('#' + id);

  const categories = {

    expense: [

      'Продукты','Кафе','Транспорт',

      'Жильё','Покупки','Здоровье',

      'Развлечения','Другое'

    ],

    income: [

      'Зарплата','Подработка',

      'Подарки','Возврат','Другое'

    ]

  };

  const now = new Date();

  const today = [

    now.getFullYear(),

    String(now.getMonth()+1).padStart(2,'0'),

    String(now.getDate()).padStart(2,'0')

  ].join('-');

  get('finDate').value = today;

  const telegramId =

    window.Telegram?.WebApp?.initDataUnsafe?.user?.id;

  const storageKey =

    'aurora_finance_v1_' + (telegramId || 'browser');

  let entries = [];

  try {

    const loaded = JSON.parse(

      localStorage.getItem(storageKey) || '[]'

    );

    if (Array.isArray(loaded)) {

      entries = loaded.filter(e =>

        e &&

        (e.type === 'income' || e.type === 'expense') &&

        Number.isSafeInteger(e.cents) &&

        e.cents > 0 &&

        typeof e.date === 'string'

      );

    }

  } catch (error) {

    console.warn('Finance storage unavailable', error);

  }

  function save(next) {

    try {

      localStorage.setItem(

        storageKey, JSON.stringify(next)

      );

      entries = next;

      return true;

    } catch(error) {

      alert('Не удалось сохранить данные на устройстве');

      return false;

    }

    return (cents/100).toLocaleString('ru-RU', {

      minimumFractionDigits:0,

      maximumFractionDigits:2

    }) + ' ₽';

    const box = get('finCategory');

    });

    'change',updateCategories

    const balance = entries.reduce((sum,e) =>

      sum + (e.type === 'income' ? e.cents : -e.cents),

      0

    );

    get('finBalance').textContent = money(balance);

    const month = today.slice(0,7);

    const selected = entries.filter(e =>

      get('finPeriod').value === 'all' ||

      e.date.startsWith(month)

    );

    const income = selected

      .filter(e => e.type === 'income')

      .reduce((sum,e) => sum+e.cents,0);

    const expense = selected

      .filter(e => e.type === 'expense')

      .reduce((sum,e) => sum+e.cents,0);

    get('finExpense').textContent = money(expense);

    list.replaceChildren();

      const empty = document.createElement('div');

      empty.className = 'fin-empty';

      empty.textContent =

      list.appendChild(empty);

        row.className = 'fin-entry';

        const info = document.createElement('div');

        info.className = 'fin-entry-info';

          ) {

            render();

          }

        });

        row.append(info,amount,del);

        list.appendChild(row);

      });

  }

  get('finForm').addEventListener('submit', event => {

    event.preventDefault();

    const raw = get('finValue').value

      .trim()

      .replace(',','.');

    if (!/^\d{1,10}(\.\d{1,2})?$/.test(raw)) {

      alert('Введите сумму с точностью до копеек');

    }

    const cents = Math.round(Number(raw)*100);

    if (!Number.isSafeInteger(cents) || cents <= 0) {

      alert('Укажите сумму больше нуля');

      return;

    }

    const entry = {

      id: Date.now()+'-'+Math.random().toString(36).slice(2),

      type: get('finType').value,

      cents,

      category: get('finCategory').value,

      date: get('finDate').value,

      note: get('finNote').value.trim()

    };

      alert('Выберите дату');

      return;

    }

    if (save([entry,...entries])) {

      get('finValue').value = '';

      get('finNote').value = '';

      render();

    }

  });

})();

<script>
(() => {
  if (document.getElementById('auroraAi')) return;

  const cards = document.querySelector('#home .cards');
  const main = document.querySelector('main');
  if (!cards || !main) return;

  const API_URL =
    'https://aurora-ai.artykartunov.workers.dev/chat';

  const tile = document.createElement('button');
  tile.type = 'button';
  tile.className = 'card';
  tile.innerHTML = `
    <span class="aurora-icon"
      aria-hidden="true">✦</span>
    <strong>GPT-чат</strong>
    <small>Твой AI-помощник</small>
  `;
  cards.appendChild(tile);

  const page = document.createElement('section');
  page.id = 'auroraAi';
  page.className = 'hidden';

  page.innerHTML = `
    <button class="back" id="aiBack"
      type="button">← На главную</button>
    <h1>AI-помощник ✦</h1>
    <p class="sub">
      Задавай вопросы, придумывай идеи и учись
    </p>

    <div class="ai-panel">
      <div class="ai-top">
        <strong>Диалог</strong>
        <button type="button" class="ai-clear"
          id="aiClear">Очистить</button>
      </div>

      <div class="ai-messages"
        id="aiMessages" aria-live="polite"></div>

      <form class="ai-compose" id="aiForm">
        <textarea id="aiInput" rows="2"
          maxlength="1500"
          placeholder="Напиши сообщение..."
          required></textarea>

        <button type="submit" class="ai-send"
          id="aiSend"
          aria-label="Отправить">➤</button>
      </form>

      <p class="ai-status" id="aiStatus">
        Готов к общению
      </p>
    </div>
  `;

  main.appendChild(page);

  const oldOpenPage = window.openPage;

  window.openPage = function(id) {
    if (typeof oldOpenPage === 'function') {
      oldOpenPage(id);
    }

    page.classList.toggle(
      'hidden', id !== 'auroraAi'
    );
  };

  tile.onclick = () => window.openPage('auroraAi');

  page.querySelector('#aiBack').onclick =
    () => window.openPage('home');

  const tg = window.Telegram?.WebApp;
  const localId =
    tg?.initDataUnsafe?.user?.id || 'browser';

  const storageKey =
    'aurora_ai_history_' + localId;

  const chat = page.querySelector('#aiMessages');
  const input = page.querySelector('#aiInput');
  const send = page.querySelector('#aiSend');
  const status = page.querySelector('#aiStatus');

  let history = [];

  try {
    const saved = JSON.parse(
      localStorage.getItem(storageKey) || '[]'
    );

    if (Array.isArray(saved)) {
      history = saved.slice(-30);
    }
  } catch (_) {}

  function persist() {
    try {
      localStorage.setItem(
        storageKey,
        JSON.stringify(history.slice(-30))
      );
    } catch (_) {
      status.textContent =
        'История не сохранилась на устройстве';
    }
  }

  function draw() {
    chat.replaceChildren();

    if (!history.length) {
      const intro = document.createElement('div');
      intro.className = 'ai-msg bot';
      intro.textContent =
        'Привет! Я помощник Авроры. ' +
        'Чем могу помочь? ✨';
      chat.appendChild(intro);
    }

    for (const message of history) {
      if (
        !['user','assistant'].includes(message.role) ||
        typeof message.content !== 'string'
      ) continue;

      const bubble = document.createElement('div');

      bubble.className =
        'ai-msg ' +
        (message.role === 'user' ? 'user' : 'bot');

      bubble.textContent = message.content;
      chat.appendChild(bubble);
    }

    chat.scrollTop = chat.scrollHeight;
  }

  page.querySelector('#aiClear').onclick = () => {
    if (!confirm('Удалить историю GPT-чата?')) {
      return;
    }

    history = [];
    persist();
    draw();
  };

  page.querySelector('#aiForm').onsubmit =
    async (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text || send.disabled) return;

      if (!tg?.initData) {
        status.textContent =
          'Открой Аврору внутри Telegram.';
        return;
      }

      if (API_URL.includes('YOUR-WORKER')) {
        status.textContent =
          'Нужно подключить сервер AI.';
        return;
      }

      history.push({
        role:'user',
        content:text
      });

      persist();
      draw();
      input.value = '';
      send.disabled = true;
      status.textContent = 'ИИ печатает…';

      try {
        const response = await fetch(API_URL, {
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({
            initData:tg.initData,
            messages:history.slice(-10)
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || 'Ошибка сервера'
          );
        }

        history.push({
          role:'assistant',
          content:data.answer
        });

        persist();
        draw();

        status.textContent = 'Готов к общению';

      } catch (error) {
        status.textContent =
          'Ошибка: ' + error.message;
      } finally {
        send.disabled = false;
      }
    };

  draw();
})();
</script>

  if (

    !home ||

    typeof window.openPage !== 'function'
  ) {
    return;
  }

  // Отдельный экран инструментов

  const homeTitle = home.querySelector('h1');
  const homeSub = home.querySelector('.sub');

  if (homeTitle) {
    homeTitle.textContent = 'Инструменты';

  if (homeSub) {

  intro.className = 'a2-tools-intro';

  intro.innerHTML = `

      <p>
        Галерея, заметки,

      </p>

      ✦ К чату
    </button>
  `;

  const cards = home.querySelector('.cards');

  if (cards) {
    home.insertBefore(intro, cards);
  }

  intro.querySelector('button').onclick = () => {
    window.openPage('auroraAi');
  };

  // Используем существующий работающий чат

  const toolbar = document.createElement('div');

  toolbar.id = 'a2Toolbar';

  toolbar.querySelector('button').onclick = () => {

  };

  const aiTitle = ai.querySelector('h1');
  const aiSub = ai.querySelector('.sub');

  if (aiTitle) {
    aiTitle.textContent = 'Чем помочь сегодня?';

  if (aiSub) {

    `;

    if (profileLabel) {
      profileLabel.textContent = 'Профиль';

    chatTab.onclick = () => {
      window.openPage('auroraAi');
    };

    toolsTab.onclick = () => {
      window.openPage('home');
    };
  }

  // Управление активной вкладкой

  const oldOpenPage = window.openPage;

  window.openPage = function(page) {

    oldOpenPage(page);

    if (chatTab && toolsTab && profileTab) {

      const current =
        page === 'auroraAi'
          ? chatTab
          : page === 'profile'
            ? profileTab
            : toolsTab;

      [chatTab, toolsTab, profileTab].forEach(button => {
        button.classList.toggle(
          'active',
          button === current
        );
      });
    }
  };

  // При запуске открывается AI-чат

  window.openPage('auroraAi');

})();

<script id="aurora-v3-behavior">
(() => {
  'use strict';

  if(window.__auroraV3Lumina) return;
  window.__auroraV3Lumina = true;

  // ОГРАНИЧЕНИЕ МАСШТАБИРОВАНИЯ

  const meta =
    document.querySelector(
      'meta[name="viewport"]'
    ) ||
    document.head.appendChild(
      document.createElement('meta')
    );

  meta.name='viewport';

  meta.content =
    'width=device-width,' +
    'initial-scale=1,' +
    'maximum-scale=1,' +
    'user-scalable=no,' +
    'viewport-fit=cover';

  [
    'gesturestart',
    'gesturechange',
    'gestureend'
  ].forEach(name => {
    document.addEventListener(
      name,
      event => event.preventDefault(),
      {passive:false}
    );
  });

  document.addEventListener(
    'touchmove',
    event => {
      if(
        event.touches &&
        event.touches.length > 1
      ){
        event.preventDefault();
      }
    },
    {passive:false}
  );

  // УДАЛЕНИЕ КНОПКИ НАПОМИНАНИЯ

  const isReminder = text => {
    const label = String(text || '')
      .toLowerCase()
      .replace(/[^a-zа-яё]+/g,' ')
      .trim();

    return [
      'напоминание',
      'напоминания',
      'напоминаний',
      'reminder',
      'reminders'
    ].includes(label);
  };

  function hideReminder(){

    const cards =
      document.querySelector('#home .cards');

    if(cards){
      [...cards.children].forEach(card => {

        const title = card.querySelector(
          'strong,h2,h3,h4,.card-title'
        );

        if(
          title &&
          isReminder(title.textContent)
        ){
          card.remove();
        }

      });
    }

    document.querySelectorAll(
      '#home button,#home a'
    ).forEach(button => {

      if(isReminder(button.textContent)){
        button.remove();
      }

    });
  }

  hideReminder();

  // ОБНОВЛЕНИЕ ТЕКСТОВ

  const intro =
    document.querySelector(
      '#home .a2-tools-intro'
    );

  if(intro){

    const title =
      intro.querySelector('strong');

    const description =
      intro.querySelector('p');

    if(title){
      title.textContent =
        'Всё нужное — под рукой';
    }

    if(description){
      description.textContent =
        'Один экран для повседневных задач';
    }
  }

  const title =
    document.querySelector('#auroraAi>h1');

  if(title){
    title.textContent = 'С чего начнём?';
  }

  const subtitle =
    document.querySelector('#auroraAi>.sub');

  if(subtitle){
    subtitle.textContent =
      'Аврора рядом — спроси о чём угодно ✦';
  }

  // СОХРАНЯЕМ РАБОТУ НАВИГАЦИИ

  if(typeof window.openPage === 'function'){

    const previousOpenPage = window.openPage;

    window.openPage = function(page,...args){

      const result = previousOpenPage.call(
        this,page,...args
      );

      if(page === 'home'){
        hideReminder();
      }

      return result;
    };
  }

})();
</script>

<script id="aurora-chat-v5-logic">
(() => {

  if(window.__auroraChatV5) return;

  const input =
    document.getElementById('aiInput');

  const messages =
    document.querySelector(
      '#auroraAi .ai-messages'
    );

  if(!input || !messages) return;

  window.__auroraChatV5 = true;

  // Аврора вместо стороннего AI-помощника

  const title =
    document.querySelector(
      '#auroraAi .ai-top strong'
    );

  if(title){
    title.textContent='Аврора';
  }

  const subtitle =
    document.querySelector(
      '#auroraAi > .sub'
    );

  if(subtitle){
    subtitle.textContent =
      'Я рядом. Расскажи, что у тебя на уме ✨';
  }

  input.placeholder='Напиши Авроре...';

  // Высота видимой части экрана iPhone

  const viewport=window.visualViewport;
  const root=document.documentElement;

  const updateViewport=()=>{

    const h=viewport
      ? viewport.height
      : window.innerHeight;

    const top=viewport
      ? viewport.offsetTop
      : 0;

    root.style.setProperty(
      '--aurora-visible-height',
      `${Math.max(160,h)}px`
    );

    root.style.setProperty(
      '--aurora-visible-top',
      `${Math.max(0,top)}px`
    );
  };

  const toBottom=()=>{
    messages.scrollTop=messages.scrollHeight;
  };

  const onFocus=()=>{

    document.body.classList.add(
      'aurora-typing'
    );

    updateViewport();

    requestAnimationFrame(toBottom);

    setTimeout(()=>{
      updateViewport();
      toBottom();
    },250);
  };

  input.addEventListener('focus',onFocus);

  input.addEventListener('blur',()=>{

    setTimeout(()=>{

      if(document.activeElement!==input){
        document.body.classList.remove(
          'aurora-typing'
        );
      }

    },100);

  });

  if(viewport){

    viewport.addEventListener('resize',()=>{

      updateViewport();

      if(document.activeElement===input){
        requestAnimationFrame(toBottom);
      }

    });

    viewport.addEventListener(
      'scroll',
      updateViewport
    );
  }

  window.addEventListener(
    'resize',
    updateViewport
  );

  updateViewport();

})();
</script>
