.btn {min-height:41px;font-size:12px;border-radius:13px}
.tool-compact,.setting-link {border-radius:16px;min-height:64px}
.field {margin-top:12px}
.field&gt;span {margin-bottom:5px}
.input {min-height:44px;border-radius:12px;padding:10px 12px}
textarea.input {min-height:94px}
.bottom {
  background:linear-gradient(to top,rgba(250,244,254,.82),rgba(250,244,254,0));
  padding:0 10px calc(7px + env(safe-area-inset-bottom,0px));
}
.bottom-inner {
  max-width:480px;
  padding:5px 4px;
  border-radius:20px;
  background:rgba(255,255,255,.70);
  border:1px solid rgba(255,255,255,.95);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 4px 23px #9e78b423;
}
.nav-tab {gap:2px;padding:5px 2px 4px;font-size:10px;border-radius:14px}
.nav-tab .nav-icon,.nav-tab.nav-create .nav-icon {
  width:30px;height:30px;border-radius:11px;
  background:transparent;box-shadow:none;margin:0;
}
.nav-tab .ui-icon {width:19px;height:19px}
.nav-tab.active .nav-icon,.nav-tab.nav-create.active .nav-icon {background:#f0e0f8;color:#9650cc}
.modal-back {
  padding:0 0 env(safe-area-inset-bottom,0px);
  align-items:flex-end;
  overscroll-behavior:contain;
}
.modal-sheet {
  max-height:min(88dvh,760px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  border-radius:23px 23px 0 0;
  background:rgba(255,251,255,.97);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}
.modal-sheet.aur-reply-sheet {max-height:88dvh;border-radius:23px 23px 0 0}
#toast {max-width:calc(100vw - 26px)}
@media(max-width:360px) {
  .shell {padding-left:11px;padding-right:11px}
  .aur-hero-copy {width:72%;padding:14px 11px}
  .aur-hero h2 {font-size:19px}
  .aur-hero p {font-size:9px}
  .aur-bottle {right:5px;transform:rotate(4deg) scale(.62)}
  .aur-shortcuts button {padding:9px;font-size:10px}
}
@media(prefers-reduced-transparency:reduce) {
  .glass,.panel,.aur-recent,.aur-shortcuts button,.aur-empty-inline,.bottom-inner {
    backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff;
  }
}

(function preventInAppZoom(){

    const t=e.target;

    if(!e.target?.closest?.(&#x27;input,textarea,select,[contenteditable],.textresult,.selectable&#x27;))e.preventDefault();
