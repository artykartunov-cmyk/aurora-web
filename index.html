<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5e6fc">
<title>Аврора Business — магазин и AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--ink:#2b204b;--muted:#83759d;--violet:#8755d2;--magenta:#e05dc2;--pink:#faacd9;--line:#e7d9f1;--card:rgba(255,255,255,.80);--bg:#f8eefd;--shade:0 9px 29px rgba(119,58,152,.10);--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:radial-gradient(ellipse 76% 34% at 95% -4%,#efb4fb 0%,transparent 72%),radial-gradient(ellipse 58% 24% at 0 48%,#f9cfec 0%,transparent 86%),linear-gradient(152deg,#fff3fa,#f6ebff 55%,#efe5ff);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b485ee;outline-offset:2px}
#app{max-width:610px;margin:0 auto;padding:18px 18px calc(104px + var(--safe));min-height:100vh;position:relative}#app:before{content:'✦';position:fixed;pointer-events:none;top:19%;right:5%;color:#e1baf8;font-size:38px;filter:blur(.5px);opacity:.3}.brand{display:flex;justify-content:space-between;align-items:center;margin:4px 0 22px;gap:12px}.mark{display:flex;align-items:center;gap:11px}.mark-icon{width:45px;height:45px;border-radius:16px;display:grid;place-items:center;color:white;font-size:27px;font-weight:800;font-style:italic;background:linear-gradient(135deg,#fe91cc,#9b59df 70%,#735bdb);box-shadow:0 8px 22px #d69adfaa}.brand strong{font-size:17px;line-height:1.2;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px;font-weight:600}.circle-btn{display:grid;place-items:center;width:43px;height:43px;border-radius:15px;background:rgba(255,255,255,.78);border:1px solid white;color:var(--violet);box-shadow:var(--shade)}
h1{font-size:30px;letter-spacing:-1.1px;margin:0;font-weight:800;line-height:1.2}h2{font-size:19px;letter-spacing:-.5px;margin:0;font-weight:800}h3{font-size:16px;margin:0;font-weight:800}p{line-height:1.55}.muted{color:var(--muted)}.subtitle{font-size:13px;margin:6px 0 22px;color:var(--muted)}.section-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 13px}.eyebrow{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;color:#9974bd}.view-all{background:none;border:0;color:#8852ce;font-size:12px;font-weight:800}.glass{background:var(--card);border:1px solid rgba(255,255,255,.92);box-shadow:var(--shade);border-radius:22px}.hero{background:radial-gradient(circle at 82% 15%,rgba(255,255,255,.7),transparent 28%),linear-gradient(120deg,#f8c5ea 0%,#e6c8fc 54%,#bda5f5 100%);border:1px solid #fff8ff;box-shadow:0 17px 35px rgba(149,85,180,.18);padding:23px 18px;display:flex;position:relative;min-height:185px;overflow:hidden;border-radius:28px}.hero .hero-copy{position:relative;z-index:1;max-width:65%}.hero h2{font-size:24px;line-height:1.14;margin:8px 0}.hero p{font-size:12px;margin:0 0 15px;color:#664d80}.hero .orb{position:absolute;right:-21px;top:16px;width:150px;height:145px;border-radius:50%;background:linear-gradient(135deg,#fff8ff90,#f5a2dc80);filter:drop-shadow(0 10px 12px #ad71c056);display:grid;place-items:center;transform:rotate(-13deg)}.orb svg{width:91px;height:91px;stroke:#8958be;stroke-width:1.1;filter:drop-shadow(0 7px 5px #9b5fbe55)}.pill{font-size:10px;border-radius:100px;display:inline-flex;gap:5px;align-items:center;padding:6px 10px;color:#75358c;background:#ffffffa9;font-weight:800}.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:15px;padding:13px 15px;font-size:13px;font-weight:800;text-align:center;min-height:45px}.primary{color:white;background:linear-gradient(105deg,#f270ba,#ad65de 65%,#825fe0);box-shadow:0 8px 18px #cc81cf70}.soft{background:#f4e9fc;color:#7c4ec2;border:1px solid #ead7fa}.light{color:#713c94;background:#fff8ff}.outline{background:#fffafedc;color:#714caa;border:1px solid #ebd7f4}.danger{color:#c75085;background:#ffebf1}.btn.block{width:100%}.button-row{display:flex;gap:10px;flex-wrap:wrap}.button-row .btn{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{min-height:135px;display:flex;flex-direction:column;gap:11px;align-items:flex-start;padding:17px;border:1px solid white;border-radius:23px;background:linear-gradient(150deg,#fffaffed,#f5e5fded);box-shadow:var(--shade);text-align:left;color:var(--ink)}.tile .ico,.item-ico{display:grid;place-items:center;width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,#ffcef0,#d9bafa);box-shadow:inset 0 1px 0 #fff;color:#8953c5}.tile .ico svg,.item-ico svg{width:23px;height:23px;stroke-width:1.9}.tile strong{font-size:13px;line-height:1.24}.tile small{font-size:10px;color:var(--muted);line-height:1.4}.tile .row{display:flex;align-items:center;gap:11px}.numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{padding:13px 8px;background:#fffafdce;border:1px solid #fff;border-radius:18px;text-align:center;box-shadow:var(--shade)}.metric strong{font-size:18px;display:block;letter-spacing:-.5px}.metric span{font-size:10px;color:var(--muted)}.list{display:grid;gap:10px}.list-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:19px;background:#ffffffbf;border:1px solid white;box-shadow:0 6px 18px #ab86bb15}.list-item .grow{flex:1;min-width:0}.list-item strong{display:block;font-size:13px}.list-item small{display:block;font-size:11px;color:var(--muted);margin-top:4px;word-break:break-word}.thumb{width:60px;height:60px;flex:0 0 60px;border-radius:15px;object-fit:cover;background:linear-gradient(140deg,#f8d9f2,#e5cffa);display:grid;place-items:center;color:#9f7bb6}.thumb svg{width:25px;height:25px}.chev{color:#9e7eb5}.panel{padding:17px;border-radius:24px;background:#fffaffdd;border:1px solid white;box-shadow:var(--shade);margin-top:12px}.form-grid{display:grid;gap:14px}label.field{display:block;font-size:12px;font-weight:800}.field span{display:block;margin-bottom:7px}.input,select.input,textarea.input{display:block;width:100%;margin-top:6px;padding:13px 14px;color:var(--ink);border:1px solid #e6d8f3;border-radius:14px;background:#fff;outline:0;font-size:13px;min-height:46px}.input::placeholder{color:#ac9aba}.input:focus{border-color:#a57ae7;box-shadow:0 0 0 3px #ab83ea25}textarea.input{min-height:110px;resize:vertical}.hint{font-size:11px;line-height:1.5;color:#8b7aa0}.drop{border:1.5px dashed #cb94e9;border-radius:22px;background:linear-gradient(135deg,#fff1fa,#f3e8ff);padding:24px 15px;text-align:center;color:#815bb1;display:grid;justify-items:center;gap:8px;cursor:pointer}.drop svg{width:34px;height:34px}.drop strong{font-size:13px}.drop span{font-size:11px}.drop img{max-height:155px;max-width:100%;border-radius:13px;object-fit:contain}.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chip{border-radius:100px;border:1px solid #ead6f6;background:#fffafeee;color:#8253b5;padding:9px 12px;font-size:11px;font-weight:800}.chip.active{background:linear-gradient(115deg,#f39dce,#bd8cea);color:#4a275d;border-color:#f5c9e5}.tag{font-size:10px;padding:5px 8px;border-radius:100px;background:#f6e4fb;color:#8859af;font-weight:800}.tag.green{background:#def7ec;color:#32886b}.tag.orange{background:#fff1db;color:#b77d38}.tag.gray{background:#f1ebf4;color:#7b7186}.empty{text-align:center;padding:34px 18px;background:#ffffff7f;border:1px solid white;border-radius:23px}.empty-icon{width:60px;height:60px;border-radius:19px;margin:0 auto 12px;display:grid;place-items:center;background:#f4def9;color:#aa73ce}.empty-icon svg{width:30px;height:30px}.empty strong{display:block;font-size:15px}.empty p{font-size:12px;color:var(--muted);margin:7px 0 18px}.notice{padding:12px 14px;background:#fff9ed;border:1px solid #efdcb6;border-radius:14px;color:#895f36;font-size:11px;line-height:1.55;margin:0 0 18px}.notice.live{background:#effff5;border-color:#d1eedb;color:#468365}.notice.error{background:#fff0f5;border-color:#f2c3d7;color:#a63f74}.divider{height:1px;background:#eaddef;margin:15px 0}.product-card{display:flex;gap:13px;padding:12px;background:#fffaffdb;border:1px solid white;border-radius:20px;box-shadow:var(--shade);margin-bottom:10px}.product-card .grow{min-width:0;flex:1}.product-card h3{font-size:13px}.product-card p{font-size:11px;color:var(--muted);margin:4px 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{font-weight:800;color:#7951b4;font-size:15px}.tiny{border:0;background:transparent;color:#875cb0;padding:7px;font-size:12px;font-weight:800}.tiny.red{color:#cb6088}.cover{width:91px;height:100px;flex:0 0 91px;border-radius:15px;object-fit:cover;background:linear-gradient(145deg,#f3d6ef,#d5c4f7);display:grid;place-items:center;color:#996fbc}.cover svg{width:35px;height:35px}.status{text-transform:none}.floating-cart{position:fixed;bottom:calc(93px + var(--safe));left:50%;transform:translateX(-50%);width:min(92%,530px);z-index:10}.bottom{position:fixed;z-index:15;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,610px);display:flex;justify-content:space-around;gap:2px;padding:9px 8px calc(10px + var(--safe));border-radius:25px 25px 0 0;border:1px solid #fff9;box-shadow:0 -10px 28px #ac79bd20;background:#fff6ffed;backdrop-filter:blur(23px)}.nav-btn{min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;color:#9c81b3;padding:7px 2px 4px;font-size:9px;font-weight:800}.nav-btn .nav-svg{display:grid;place-items:center;border-radius:14px;min-height:28px}.nav-btn svg{width:22px;height:22px;stroke-width:1.9}.nav-btn.active{color:#a254be}.nav-btn.active .nav-svg{background:#f2d5fa;padding:6px;margin:-6px}.nav-btn.add .nav-svg{width:47px;height:47px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(125deg,#f28bc8,#a467e0);color:white;box-shadow:0 6px 14px #b68adc55;margin-top:-24px;margin-bottom:-4px}.nav-btn.add svg{width:27px;height:27px}.toast{position:fixed;z-index:99;top:18px;left:50%;transform:translateX(-50%);background:#37244eea;color:white;font-size:12px;padding:11px 16px;border-radius:13px;box-shadow:0 10px 22px #715f7947;max-width:88%;text-align:center}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.split .panel{margin:0}.shop-banner{border-radius:24px;padding:24px 18px;background:linear-gradient(125deg,#f9cee8,#d9b8fa);text-align:center;margin:14px 0}.shop-banner .big{font-weight:800;font-size:25px}.button-compact{padding:9px 12px;font-size:11px;min-height:36px}.readonly{word-break:break-all;padding:11px;background:#f8efff;border-radius:12px;font-size:11px;color:#7859a1}.footnote{font-size:11px;color:#937ea2;line-height:1.55;margin-top:24px}.order-details{display:grid;gap:7px;margin:10px 0 0;font-size:11px;color:#75668d}.order-details b{color:var(--ink)}.chartbar{display:flex;height:12px;background:#f1e1f7;border-radius:12px;overflow:hidden}.chartbar>div{background:linear-gradient(100deg,#f88bd0,#a779e1)}
@media(min-width:500px){#app{padding:25px 25px 120px}.hero{min-height:205px;padding:29px 25px}.hero .orb{right:22px;top:26px}.tile{min-height:140px}.brand{margin-bottom:28px}}
</style>
</head>
<body>
<div id="app"><div id="shell"></div><div id="view"></div></div><nav class="bottom" id="nav"></nav><div id="toast" class="toast" hidden></div>
<script>
'use strict';
const API='https://aurora-ai.artykartunov.workers.dev'; // Existing Aurora Cloudflare Worker.
const tg=window.Telegram?.WebApp; try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#f7e8f8');tg?.setBackgroundColor?.('#f8eefd')}catch{}
const viewer=tg?.initDataUnsafe?.user||null;
const STORE_KEY='aurora-business-v1-'+String(viewer?.id||'browser');
const iconPaths={home:'<path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-8h6v8"/>',shop:'<path d="M3 9l2-5h14l2 5v2a3 3 0 0 1-5 2 3 3 0 0 1-4 0 3 3 0 0 1-4 0 3 3 0 0 1-5-2z"/><path d="M5 14v7h14v-7"/>',box:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M3 12h18M9 7V3h6v4"/>',orders:'<path d="M8 3h8l2 3h3v15H3V6h3z"/><path d="M8 12h8M8 16h6"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 7a3 3 0 0 1 0 6M18 16a5 5 0 0 1 4 5"/>',chart:'<path d="M4 20V11m5 9V4m5 16v-7m5 7V8"/>',spark:'<path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/><path d="m20 17 .7 2.3L23 20l-2.3.7L20 23l-.7-2.3L17 20l2.3-.7z"/>',camera:'<path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="4"/>',plus:'<path d="M12 5v14M5 12h14"/>',person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',back:'<path d="m15 18-6-6 6-6"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',star:'<path d="m12 2 3.2 6.5 7.2 1-5.2 5.1 1.2 7.2-6.4-3.4-6.4 3.4 1.2-7.2-5.2-5.1 7.2-1z"/>',check:'<path d="m4 12 5 5L20 6"/>',edit:'<path d="m16 4 4 4-12 12H4v-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6M10 10v7m4-7v7"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/>',heart:'<path d="M20.8 4.6a5 5 0 0 0-7.1 0L12 6.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21l8.8-9.3a5 5 0 0 0 0-7.1z"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6m0-10v1"/>',shopping:'<path d="M2 3h2l2.5 12h12l2.5-9H5M8 21h.01M18 21h.01"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',wallet:'<rect x="2" y="5" width="20" height="15" rx="3"/><path d="M2 10h20"/>'};
function ico(n,cls=''){return `<svg class="${cls}" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconPaths[n]||iconPaths.spark}</svg>`}
function E(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n,currency='₽'){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format((Number(n)||0)/100)+' '+currency}
function uid(){return globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
const defaultShop=()=>({name:'Мой магазин',slug:'',description:'Товары и новинки в Telegram',currency:'₽'});
let state={mode:'local',page:'home',shop:defaultShop(),products:[],orders:[],editing:null,upload:null,generated:null,filter:'all',search:'',statusFilter:'all',buyer:null,cart:[],busy:false,notice:'',buyerName:''};
function localLoad(){try{const d=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');state.shop={...defaultShop(),...(d.shop||{})};state.products=Array.isArray(d.products)?d.products:[];state.orders=Array.isArray(d.orders)?d.orders:[]}catch{}}
function localSave(){try{localStorage.setItem(STORE_KEY,JSON.stringify({shop:state.shop,products:state.products,orders:state.orders}))}catch{toast('Место в памяти браузера закончилось')}}
function toast(s){const t=document.getElementById('toast');t.textContent=String(s);t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,3200)}
async function api(path,data={},method='POST'){
 const url=API+path;
 const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:method==='POST'?JSON.stringify({initData:tg?.initData||'',...data}):undefined});
 const value=await r.json().catch(()=>({error:'Непонятный ответ сервера'}));
 if(!r.ok)throw Error(value.error||'Ошибка сервера '+r.status);
 return value;
}
function friendlyDate(x){try{return new Date(x).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}catch{return ''}}
function imgUrl(p){if(p?.imageKey&&/^[a-z0-9-]{12,64}\.jpg$/.test(p.imageKey))return API+'/business/media/'+encodeURIComponent(p.imageKey);if(p?.imageData&&/^data:image\/jpeg;base64,/i.test(p.imageData))return p.imageData;return ''}
function photo(p,large=false){const src=imgUrl(p);return src?`<img class="${large?'cover':'thumb'}" src="${E(src)}" alt="Фото товара" loading="lazy">`:`<div class="${large?'cover':'thumb'}">${ico('box')}</div>`}
function nav(){const entries=[['home','Главная','home'],['shop','Магазин','shop'],['ai','Создать','plus'],['orders','Заказы','orders'],['profile','Профиль','person']];document.getElementById('nav').innerHTML=entries.map(([id,name,i])=>`<button type="button" class="nav-btn ${id==='ai'?'add':''} ${state.page===id?'active':''}" data-action="page" data-page="${id}" aria-label="${name}"><span class="nav-svg">${ico(i)}</span>${name}</button>`).join('')}
function header(){document.getElementById('shell').innerHTML=`<div class="brand"><div class="mark"><div class="mark-icon">A</div><div><strong>Аврора <span style="color:#a45ace">Business</span></strong><small>Магазин и AI в Telegram</small></div></div><button type="button" class="circle-btn" data-action="page" data-page="profile" aria-label="Профиль">${ico('person')}</button></div>`}
function title(text,sub){return `<h1>${E(text)}</h1><p class="subtitle">${E(sub)}</p>`}
function section(title,action='',name=''){return `<div class="section-line"><h2>${E(title)}</h2>${action?`<button type="button" class="view-all" data-action="page" data-page="${action}">${E(name||'Все')} →</button>`:''}</div>`}
function panelEmpty(icon,title,sub,btn='',action=''){return `<div class="empty"><div class="empty-icon">${ico(icon)}</div><strong>${E(title)}</strong><p>${E(sub)}</p>${btn?`<button class="btn primary" data-action="page" data-page="${action}">${E(btn)}</button>`:''}</div>`}
function statusLabel(s){return ({new:'Новый',processing:'В работе',done:'Завершён',cancelled:'Отменён'})[s]||'Новый'}
function statusTag(s){return s==='done'?'green':s==='new'?'orange':'gray'}
function activeOrders(){return state.orders.filter(x=>x.status!=='cancelled')}
function stats(){const a=activeOrders();return {products:state.products.length,orders:state.orders.length,sales:a.filter(x=>x.status==='done').reduce((sum,o)=>sum+Number(o.totalMinor||0),0),clients:new Set(state.orders.map(o=>o.buyerId||o.phone).filter(Boolean)).size}}
function metric(name,value){return `<div class="metric"><strong>${E(value)}</strong><span>${E(name)}</span></div>`}
function home(){const s=stats();const who=viewer?.first_name?'Привет, '+viewer.first_name+'!':'Добро пожаловать!';return `<div class="eyebrow">ТВОЙ БИЗНЕС-ПОМОЩНИК ✦</div>${title(who,'Создавай товары, принимай заявки и развивай магазин.')}
${state.mode==='local'?`<div class="notice">Режим предпросмотра: изменения хранятся только на этом устройстве. Для общего Telegram-магазина подключи Cloudflare D1 и Worker.</div>`:`<div class="notice live">${ico('check')} Данные магазина синхронизируются через Cloudflare.</div>`}
<div class="hero"><div class="hero-copy"><span class="pill">${ico('spark')} AI-помощник продавца</span><h2>Твой магазин.<br>Твои правила.</h2><p>Создай карточку товара за пару нажатий.</p><button class="btn primary button-compact" data-action="page" data-page="ai">Создать карточку ${ico('arrow')}</button></div><div class="orb">${ico('shopping')}</div></div>
${section('Обзор магазина')}<div class="numbers">${metric('Товары',s.products)}${metric('Заказы',s.orders)}${metric('Выручка',money(s.sales))}</div>
${section('Быстрый доступ')}<div class="grid">
${tile('spark','AI генератор','Описания и посты','ai')}${tile('shop','Мой магазин','Витрина и настройки','shop')}${tile('box','Каталог','Добавить товар','catalog')}${tile('orders','Заказы','Заявки покупателей','orders')}${tile('users','Клиенты','Покупатели и история','clients')}${tile('chart','Аналитика','Цифры по продажам','analytics')}
</div>${section('Последние заказы','orders','Смотреть')} ${state.orders.length?state.orders.slice(0,3).map(orderSnippet).join(''):panelEmpty('orders','Пока нет заказов','Когда покупатель отправит заявку, она появится здесь.')}`}
function tile(i,name,sub,page){return `<button type="button" class="tile" data-action="page" data-page="${page}"><span class="ico">${ico(i)}</span><div><strong>${E(name)}</strong><small style="display:block;margin-top:5px">${E(sub)}</small></div></button>`}
function ai(){return `${title('AI генератор','Из фотографии или коротких заметок — в готовое описание.')}
<div class="panel"><form id="aiForm" class="form-grid"><label class="drop" for="aiPhoto"><span id="aiPhotoPreview">${state.upload?`<img src="${E(state.upload)}" alt="Выбранное фото">`:ico('camera')}</span><strong>Загрузить фото товара</strong><span>JPG, PNG или WEBP — необязательно</span></label><input type="file" id="aiPhoto" accept="image/jpeg,image/png,image/webp" style="display:none">
<label class="field"><span>Что это за товар?</span><input class="input" id="aiName" maxlength="100" placeholder="Например, беспроводные наушники"></label>
<label class="field"><span>Известные характеристики</span><textarea id="aiFeatures" class="input" maxlength="650" placeholder="Материал, цвет, модель, особенности... (только то, что точно известно)"></textarea></label>
<label class="field"><span>Стиль текста</span><select class="input" id="aiTone"><option value="sales">Продающий</option><option value="neutral">Нейтральный</option><option value="short">Короткий</option></select></label>
<button class="btn primary block" type="submit" ${state.busy?'disabled':''}>${ico('spark')} ${state.busy?'Генерируем…':'Создать описание и пост'}</button>
<div class="hint">AI доступен только после подключения Worker и запуска внутри Telegram. Модель может ошибаться — проверяй характеристики перед публикацией.</div></form></div>
${state.generated?`<div class="panel" id="gen-result"><div class="section-line" style="margin-top:0"><h2>Результат AI</h2><span class="tag green">Готово</span></div><h3>${E(state.generated.title)}</h3><p style="font-size:12px;white-space:pre-line">${E(state.generated.description)}</p><div class="divider"></div><div class="eyebrow">ПОСТ ДЛЯ TELEGRAM</div><p style="font-size:12px;white-space:pre-line">${E(state.generated.post)}</p><div class="button-row"><button class="btn soft" type="button" data-action="copyPost">${ico('copy')} Скопировать</button><button class="btn primary" type="button" data-action="addGenerated">${ico('plus')} В каталог</button></div></div>`:''}`}
function shop(){const s=stats(),link=shopLink();return `${title('Мой магазин','Управляй витриной и приглашай покупателей.')}
<div class="shop-banner"><div class="mark-icon" style="margin:0 auto 10px">${ico('shop')}</div><div class="big">${E(state.shop.name)}</div><div class="muted" style="font-size:12px">${E(state.shop.description)}</div></div>
<div class="numbers">${metric('Товары',s.products)}${metric('Заказы',s.orders)}${metric('Клиенты',s.clients)}</div>
${section('Настройки магазина')}<div class="panel"><form id="shopForm" class="form-grid">
<label class="field"><span>Название</span><input id="shopName" class="input" value="${E(state.shop.name)}" maxlength="60" required></label>
<label class="field"><span>Адрес магазина латиницей</span><input id="shopSlug" class="input" value="${E(state.shop.slug)}" placeholder="my-store" pattern="[a-z0-9_-]{4,28}" minlength="4" maxlength="28" required></label>
<label class="field"><span>Описание</span><textarea id="shopDesc" maxlength="280" class="input">${E(state.shop.description)}</textarea></label>
<button type="submit" class="btn primary block">Сохранить магазин</button></form></div>
${state.shop.slug?`<div class="panel"><h3>Ссылка на витрину</h3><p class="hint">Делись ссылкой с покупателями. Заявки работают после публикации через Worker в Telegram.</p><div class="readonly">${E(link)}</div><div class="button-row" style="margin-top:12px"><button class="btn soft" data-action="copyLink">${ico('copy')} Копировать</button><button class="btn primary" data-action="previewStore">${ico('shop')} Открыть</button></div></div>`:''}
${section('Товары','catalog','Все')} ${state.products.length?state.products.slice(0,2).map(productRow).join(''):panelEmpty('box','Каталог пуст','Добавь первый товар — вручную или через AI.','Добавить товар','edit')}`}
function productRow(p){return `<div class="product-card">${photo(p,true)}<div class="grow"><h3>${E(p.title)}</h3><p>${E(p.description)}</p><span class="price">${money(p.priceMinor)}</span><div class="hint">Остаток: ${E(p.stock)} · ${p.published?'На витрине':'Черновик'}</div><div style="display:flex;gap:10px;margin-top:7px"><button type="button" class="tiny" data-action="edit" data-id="${E(p.id)}">${ico('edit')} Изменить</button><button type="button" class="tiny red" data-action="delete" data-id="${E(p.id)}">Удалить</button></div></div></div>`}
function catalog(){const products=state.products.filter(p=>(state.filter==='all'||(state.filter==='published'?p.published:!p.published))&&`${p.title} ${p.category||''}`.toLowerCase().includes(state.search.toLowerCase()));return `${title('Каталог товаров','Управление товарами твоего магазина.')}
<button class="btn primary block" data-action="newProduct">${ico('plus')} Добавить товар</button>
<div class="chip-row">${[['all','Все'],['published','Опубликованы'],['draft','Черновики']].map(([v,t])=>`<button class="chip ${state.filter===v?'active':''}" data-action="filter" data-val="${v}">${t}</button>`).join('')}</div>
<input class="input" id="catalogSearch" placeholder="Поиск товаров" value="${E(state.search)}" aria-label="Поиск товаров" style="margin-bottom:15px">
<div id="catalogResults">${products.length?products.map(productRow).join(''):panelEmpty('box','Товары не найдены','Измени фильтр или добавь новый товар.')}</div>`}
function editor(){const p=state.editing?state.products.find(x=>x.id===state.editing):null;const d=p||{title:state.generated?.title||'',description:state.generated?.description||'',priceMinor:0,stock:1,category:'',published:true,imageData:state.upload||''};return `${title(p?'Редактировать товар':'Новый товар','Добавь фотографию, цену и описание.')}
<div class="panel"><form id="productForm" class="form-grid"><label for="prodPhoto" class="drop"><span id="prodPhotoPreview">${state.upload||imgUrl(d)?`<img src="${E(state.upload||imgUrl(d))}" alt="Фото товара">`:ico('camera')}</span><strong>Добавить фотографию</strong><span>До 5 МБ, автоматически уменьшим</span></label><input type="file" id="prodPhoto" accept="image/jpeg,image/png,image/webp" hidden>
<label class="field"><span>Название товара</span><input id="prodTitle" class="input" maxlength="120" value="${E(d.title)}" required></label>
<label class="field"><span>Описание</span><textarea id="prodDesc" class="input" maxlength="2000">${E(d.description)}</textarea></label>
<div class="split"><label class="field"><span>Цена (₽)</span><input type="number" id="prodPrice" min="0" max="99999999" step="0.01" class="input" value="${E((Number(d.priceMinor)||0)/100)}" required></label><label class="field"><span>Количество</span><input type="number" id="prodStock" min="0" max="999999" step="1" class="input" value="${E(d.stock)}" required></label></div>
<label class="field"><span>Категория</span><input id="prodCategory" class="input" maxlength="50" value="${E(d.category||'')}" placeholder="Например, электроника"></label>
<label style="font-size:12px;display:flex;align-items:center;gap:10px;font-weight:800"><input id="prodPublished" type="checkbox" ${d.published?'checked':''} style="accent-color:#aa68d5;width:19px;height:19px"> Показывать в магазине</label>
<button class="btn primary block" type="submit">${ico('check')} Сохранить товар</button></form></div>`}
function orderSnippet(o){return `<div class="list-item"><span class="item-ico">${ico('orders')}</span><div class="grow"><strong>Заказ #${E(o.id.slice(0,8).toUpperCase())}</strong><small>${E(o.customerName||'Покупатель')} · ${friendlyDate(o.createdAt)}</small></div><div style="text-align:right"><strong style="font-size:12px">${money(o.totalMinor)}</strong><span class="tag ${statusTag(o.status)}">${statusLabel(o.status)}</span></div></div>`}
function orders(){const arr=state.orders.filter(o=>state.statusFilter==='all'||o.status===state.statusFilter);return `${title('Заказы','Заявки покупателей и их статусы.')}
<div class="chip-row">${[['all','Все'],['new','Новые'],['processing','В работе'],['done','Готово']].map(([v,t])=>`<button class="chip ${state.statusFilter===v?'active':''}" data-action="orderFilter" data-val="${v}">${t}</button>`).join('')}</div>
${arr.length?arr.map(o=>`<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div><strong>Заказ #${E(o.id.slice(0,8).toUpperCase())}</strong><div class="hint">${friendlyDate(o.createdAt)}</div></div><span class="tag ${statusTag(o.status)}">${statusLabel(o.status)}</span></div>
<div class="order-details"><div>Покупатель: <b>${E(o.customerName)}</b></div><div>Телефон: <b>${E(o.phone||'—')}</b></div>${o.comment?`<div>Комментарий: <b>${E(o.comment)}</b></div>`:''}<div>Товары: <b>${E((o.items||[]).map(x=>(x.title||'Товар')+' ×'+x.qty).join(', '))}</b></div></div><div class="section-line" style="margin:12px 0 0"><div class="price">${money(o.totalMinor)}</div><select class="input" aria-label="Статус заказа" data-order-status="${E(o.id)}" style="width:145px;min-height:38px;padding:8px 9px"><option value="new" ${o.status==='new'?'selected':''}>Новый</option><option value="processing" ${o.status==='processing'?'selected':''}>В работе</option><option value="done" ${o.status==='done'?'selected':''}>Завершён</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Отменён</option></select></div></div>`).join(''):panelEmpty('orders','Заказов пока нет','Когда появятся заявки с витрины, ты увидишь их здесь.')}`}
function clients(){const m=new Map();for(const o of state.orders){const key=o.buyerId||o.phone||o.customerName||o.id;let x=m.get(key);if(!x){x={name:o.customerName,phone:o.phone,orders:0,total:0};m.set(key,x)}x.orders++;if(o.status==='done')x.total+=Number(o.totalMinor||0)}return `${title('Клиенты','Покупатели из реальных заявок магазина.')}${m.size?`<div class="list">${[...m.values()].map(c=>`<div class="list-item"><span class="item-ico">${ico('person')}</span><div class="grow"><strong>${E(c.name||'Покупатель')}</strong><small>${E(c.phone||'Без телефона')} · Заказов: ${c.orders}</small></div><strong style="font-size:12px">${money(c.total)}</strong></div>`).join('')}</div>`:panelEmpty('users','Покупателей пока нет','Здесь автоматически появятся клиенты после первых заказов.')}`}
function analytics(){const s=stats();const counts={new:0,processing:0,done:0,cancelled:0};for(const o of state.orders)counts[o.status]=(counts[o.status]||0)+1;const max=Math.max(1,...Object.values(counts));return `${title('Аналитика','Показатели на основе сохранённых заказов.')}
<div class="numbers">${metric('Заказы',s.orders)}${metric('Клиенты',s.clients)}${metric('Выручка',money(s.sales))}</div><div class="panel"><h2>Статусы заказов</h2><p class="hint">Выручка учитывает только завершённые заявки — это не подтверждение оплаты.</p>${Object.entries(counts).map(([name,num])=>`<div style="margin:15px 0"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:6px"><span>${statusLabel(name)}</span><span>${num}</span></div><div class="chartbar"><div style="width:${(num/max)*100}%"></div></div></div>`).join('')}</div>`}
function profile(){return `${title('Профиль','Настройки Aurora Business и подключения.')}
<div class="panel"><div style="display:flex;align-items:center;gap:13px"><div class="mark-icon">${E((viewer?.first_name||'A').slice(0,1))}</div><div><strong>${E([viewer?.first_name,viewer?.last_name].filter(Boolean).join(' ')||'Пользователь')}</strong><div class="hint">${viewer?.username?'@'+E(viewer.username):'Аккаунт Telegram'} · ${state.mode==='server'?'Синхронизация включена':'Локальный режим'}</div></div></div></div>
${section('Возможности')}<div class="list">${[['shop','Мой магазин','Настройка витрины'],['ai','AI-генератор','Тексты по фото'],['clients','Клиенты','История покупателей']].map(([p,t,s])=>`<button type="button" class="list-item" data-action="page" data-page="${p}" style="text-align:left;border:1px solid white"><span class="item-ico">${ico(p==='ai'?'spark':p==='clients'?'users':'shop')}</span><span class="grow"><strong>${t}</strong><small>${s}</small></span>${ico('arrow')}</button>`).join('')}</div>
<div class="panel"><h3>Подключение магазина</h3><p class="hint">Данные продавца должны сохраняться в Cloudflare D1. Для изображений нужен R2; для AI — ключ Яндекса и включённый доступ. Для покупателей магазин открывается внутри Telegram.</p><p class="hint">Платежи, PRO-тарифы и автопостинг будут отдельными модулями. Сейчас кнопка «Заказать» создаёт заявку без списания денег.</p><button class="btn soft block" data-action="reload">Проверить подключение</button></div>`}
function shopLink(){if(!state.shop.slug)return '';return location.origin+location.pathname+'?shop='+encodeURIComponent(state.shop.slug)}
function storeScreen(){const d=state.buyer||{};const q=state.cart.reduce((sum,x)=>sum+x.qty,0);const total=state.cart.reduce((sum,x)=>sum+x.qty*x.priceMinor,0);const products=(d.products||[]).filter(x=>x.published!==false);return `<div class="eyebrow">ВИТРИНА TELEGRAM-МАГАЗИНА</div>${title(d.shop?.name||'Магазин',d.shop?.description||'Товары и новинки')}
${!state.buyer?.live?'<div class="notice">Предпросмотр витрины. Это не опубликованный магазин — заказы здесь не принимаются.</div>':''}
<div class="grid">${products.length?products.map(p=>`<div class="tile" style="min-height:260px;padding:12px;display:flex;flex-direction:column"><div style="width:100%;height:126px;overflow:hidden;border-radius:17px;background:#eedcf7;display:grid;place-items:center">${imgUrl(p)?`<img src="${E(imgUrl(p))}" alt="Фото товара" style="width:100%;height:100%;object-fit:cover">`:ico('box')}</div><strong>${E(p.title)}</strong><small style="display:block;flex:1">${E(p.description||'').slice(0,110)}</small><div class="price">${money(p.priceMinor)}</div><button class="btn primary block button-compact" data-action="cartAdd" data-id="${E(p.id)}" ${Number(p.stock)===0?'disabled':''}>${Number(p.stock)===0?'Нет в наличии':'В корзину +'}</button></div>`).join(''):panelEmpty('box','Товаров нет','В магазине ещё нет опубликованных товаров.')}</div>
${q?`<div class="floating-cart"><button class="btn primary block" data-action="showCheckout">${ico('shopping')} Корзина · ${q} шт. · ${money(total)}</button></div>`:''}`}
function checkout(){const total=state.cart.reduce((sum,x)=>sum+x.qty*x.priceMinor,0);return `${title('Оформить заявку','Это заказ без онлайн-оплаты.')}
<div class="panel"><div class="list">${state.cart.map(c=>`<div class="list-item"><span class="grow"><strong>${E(c.title)}</strong><small>${c.qty} шт.</small></span><div class="price">${money(c.priceMinor*c.qty)}</div><button type="button" class="tiny red" data-action="cartRemove" data-id="${E(c.id)}">×</button></div>`).join('')}</div><div class="section-line"><h3>Итого</h3><span class="price">${money(total)}</span></div><form id="checkoutForm" class="form-grid"><label class="field"><span>Как к тебе обращаться?</span><input class="input" name="name" maxlength="65" value="${E(state.buyerName||viewer?.first_name||'')}" required></label><label class="field"><span>Телефон для связи</span><input name="phone" type="tel" class="input" maxlength="30" placeholder="+7..." required></label><label class="field"><span>Комментарий</span><textarea name="comment" class="input" maxlength="500" placeholder="Доставка, вопросы по заказу"></textarea></label><button class="btn primary block" type="submit">Отправить заявку</button></form></div>
<div class="notice">Магазин получит ваши данные для обработки заявки. Оплата на этом этапе не производится.</div>`}
function render(){header();nav();let html='';if(state.buyer){html=state.page==='checkout'?checkout():storeScreen()}else{html=({home,ai,shop,catalog,edit:editor,orders,clients,analytics,profile})[state.page]?.()||home()}document.getElementById('view').innerHTML=html;window.scrollTo({top:0,behavior:'instant'})}
function switchPage(page){state.page=page;state.search='';if(page==='edit'){state.editing=null;state.upload=null}render()}
async function load(){localLoad();const params=new URLSearchParams(location.search);const slug=params.get('shop');if(slug){state.page='store';try{const response=await fetch(API+'/business/store?slug='+encodeURIComponent(slug));const d=await response.json();if(!response.ok)throw Error(d.error||'Магазин не найден');state.buyer={...d,live:true};state.mode='server'}catch(e){state.buyer={shop:{name:'Магазин недоступен',description:String(e.message)},products:[],live:false}}}else if(tg?.initData){try{const data=await api('/business/bootstrap');state.shop={...defaultShop(),...(data.shop||{})};state.products=data.products||[];state.orders=data.orders||[];state.mode='server'}catch(e){state.notice=e.message;state.mode='local'}}render()}
async function shrinkPhoto(file){if(!file||!/^image\/(jpeg|png|webp)$/.test(file.type))throw Error('Выбери JPG, PNG или WEBP');if(file.size>5*1024*1024)throw Error('Фото не должно превышать 5 МБ');const image=await createImageBitmap(file);const scale=Math.min(1,880/Math.max(image.width,image.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(image.width*scale));c.height=Math.max(1,Math.round(image.height*scale));c.getContext('2d').drawImage(image,0,0,c.width,c.height);image.close?.();return c.toDataURL('image/jpeg',.72)}
function showPreview(id){const el=document.getElementById(id);if(el&&state.upload)el.innerHTML=`<img src="${E(state.upload)}" alt="Фото">`}
function safeSlug(raw){return raw.toLowerCase().trim().replace(/[^a-z0-9_-]/g,'')}
async function saveProduct(form){const title=form.querySelector('#prodTitle').value.trim(),desc=form.querySelector('#prodDesc').value.trim(),price=Number(form.querySelector('#prodPrice').value),stock=Number(form.querySelector('#prodStock').value),published=form.querySelector('#prodPublished').checked,category=form.querySelector('#prodCategory').value.trim();if(!title||!Number.isFinite(price)||price<0||!Number.isSafeInteger(stock)||stock<0)throw Error('Проверь название, цену и остаток');let cur=state.editing?state.products.find(p=>p.id===state.editing):null;let imgData=state.upload||cur?.imageData||null,imageKey=cur?.imageKey||null;if(state.upload&&state.mode==='server'){const result=await api('/business/media/upload',{image:state.upload});imageKey=result.imageKey;imgData=null}const p={id:cur?.id||uid(),title,description:desc,priceMinor:Math.round(price*100),stock,category,published,imageKey,imageData:imgData};if(state.mode==='server'){const d=await api('/business/product/save',{product:p});const i=state.products.findIndex(x=>x.id===p.id);if(i>=0)state.products[i]=d.product;else state.products.unshift(d.product)}else{const i=state.products.findIndex(x=>x.id===p.id);if(i>=0)state.products[i]=p;else state.products.unshift(p);localSave()}state.editing=null;state.upload=null;toast('Товар сохранён');switchPage('catalog')}
async function saveShop(form){const name=form.querySelector('#shopName').value.trim(),slug=safeSlug(form.querySelector('#shopSlug').value),description=form.querySelector('#shopDesc').value.trim();if(name.length<2||slug.length<4)throw Error('Укажи название и адрес от 4 символов');const payload={name,slug,description};if(state.mode==='server'){const d=await api('/business/shop/save',payload);state.shop=d.shop}else{state.shop={...state.shop,...payload};localSave()}toast('Магазин сохранён');render()}
async function generateAI(form){if(!tg?.initData)throw Error('Открой мини-приложение внутри Telegram');if(state.mode!=='server')throw Error('Сначала подключи Cloudflare Worker и базу D1');const name=form.querySelector('#aiName').value.trim(),features=form.querySelector('#aiFeatures').value.trim(),tone=form.querySelector('#aiTone').value;if(!name&&!state.upload)throw Error('Добавь фото или название товара');const result=await api('/business/generate',{name,features,tone,image:state.upload||undefined});state.generated={title:result.title,description:result.description,post:result.post};toast('Карточка сгенерирована')}
async function deleteProduct(id){const p=state.products.find(x=>x.id===id);if(!p)return;if(!confirm('Удалить товар «'+p.title+'»?'))return;if(state.mode==='server')await api('/business/product/delete',{id});state.products=state.products.filter(x=>x.id!==id);localSave();toast('Товар удалён');render()}
function clipboard(text){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Скопировано')).catch(()=>toast('Не удалось скопировать'));else{const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();toast('Скопировано')}}
async function storePreview(){if(state.mode==='server'&&state.shop.slug){location.href=shopLink();return}state.buyer={shop:{...state.shop},products:state.products.filter(x=>x.published),live:false};state.page='store';state.cart=[];render()}
async function checkoutOrder(form){if(!state.buyer?.live)throw Error('В режиме предпросмотра заявки не отправляются');if(!tg?.initData)throw Error('Для заказа открой магазин внутри Telegram');const name=form.elements.name.value.trim(),phone=form.elements.phone.value.trim(),comment=form.elements.comment.value.trim();if(name.length<2||phone.length<6)throw Error('Проверь имя и телефон');const d=await api('/business/order/create',{slug:new URLSearchParams(location.search).get('shop'),items:state.cart.map(c=>({productId:c.id,qty:c.qty})),customerName:name,phone,comment});state.cart=[];state.buyerName=name;toast('Заявка отправлена: '+d.orderId.slice(0,8));state.page='store';render()}
function productById(id){return (state.buyer?.products||[]).find(p=>p.id===id)}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;try{
if(action==='page'){state.buyer=null;switchPage(el.dataset.page)}
else if(action==='newProduct'){state.generated=null;switchPage('edit')}
else if(action==='edit'){state.editing=id;state.upload=null;state.page='edit';render()}
else if(action==='delete')await deleteProduct(id);
else if(action==='filter'){state.filter=el.dataset.val;render()}
else if(action==='orderFilter'){state.statusFilter=el.dataset.val;render()}
else if(action==='copyPost')clipboard(state.generated?.post||'');
else if(action==='copyLink')clipboard(shopLink());
else if(action==='addGenerated'){state.editing=null;state.page='edit';render()}
else if(action==='previewStore')await storePreview();
else if(action==='reload')await load();
else if(action==='cartAdd'){const p=productById(id);if(!p)return;const cur=state.cart.find(x=>x.id===id);if(cur){if(cur.qty>=Number(p.stock))throw Error('Больше нет в наличии');cur.qty++}else state.cart.push({id,title:p.title,priceMinor:p.priceMinor,qty:1});render()}
else if(action==='cartRemove'){state.cart=state.cart.filter(c=>c.id!==id);render()}
else if(action==='showCheckout'){state.page='checkout';render()}
}catch(err){toast(err.message||'Ошибка')}});
document.addEventListener('change',async e=>{try{const t=e.target;if(t.id==='aiPhoto'||t.id==='prodPhoto'){state.upload=await shrinkPhoto(t.files?.[0]);showPreview(t.id==='aiPhoto'?'aiPhotoPreview':'prodPhotoPreview')}else if(t.matches('[data-order-status]')){const o=state.orders.find(x=>x.id===t.dataset.orderStatus);if(!o)return;if(state.mode==='server')await api('/business/order/update',{id:o.id,status:t.value});o.status=t.value;localSave();toast('Статус обновлён');render()}}catch(err){toast(err.message||'Ошибка')}});
document.addEventListener('input',e=>{if(e.target.id==='catalogSearch'){state.search=e.target.value;const el=document.getElementById('catalogResults');if(el){const arr=state.products.filter(p=>(state.filter==='all'||(state.filter==='published'?p.published:!p.published))&&`${p.title} ${p.category||''}`.toLowerCase().includes(state.search.toLowerCase()));el.innerHTML=arr.length?arr.map(productRow).join(''):panelEmpty('box','Не найдено','Попробуй другой запрос')}}});
document.addEventListener('submit',async e=>{const f=e.target;if(!['shopForm','productForm','aiForm','checkoutForm'].includes(f.id))return;e.preventDefault();if(state.busy)return;state.busy=true;const button=f.querySelector('button[type=submit]');if(button)button.disabled=true;try{if(f.id==='shopForm')await saveShop(f);if(f.id==='productForm')await saveProduct(f);if(f.id==='aiForm'){await generateAI(f);state.busy=false;render()}if(f.id==='checkoutForm')await checkoutOrder(f)}catch(err){toast(err.message||'Ошибка');state.busy=false;if(button)button.disabled=false}finally{state.busy=false}});
load();
</script>
</body></html>
