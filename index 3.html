async function send(){if(app.busy)return;const text=$('message').value.trim(),att=app.attached;if(!text)return notify('Напиши сообщение.');$('message').value='';app.attached=null;
 const mode=/^(?:сделай|создай|сгенерируй|нарисуй)\s+(?:мне\s+)?(?:ai[ -]?)?(?:фото|изображение|картинку|иллюстрацию)/i.test(text)?'image':/^(?:создай|сделай|сгенерируй)\s+(?:мне\s+)?(?:ai[ -]?)?(?:видео|ролик)/i.test(text)?'video':'chat';

 else if(mode==='video'){const result=await api('/api/video/start',{prompt:text,...(att?.kind==='image'?{reference:att.data}:{})});app.messages.push({id:newId(),role:'assistant',content:'Видео поставлено в очередь. Готовый ролик появится в истории.',jobId:result.jobId});void awaitVideo(result.jobId,text);}
 else{const response=await api('/api/chat',{text,threadId:app.threadId||undefined,search:app.web,...(att?.kind==='image'?{image:att.data}:att?.kind==='pdf'?{document:{name:att.name,data:att.data}}:{})});app.threadId=response.threadId;app.messages.push({id:newId(),role:'assistant',content:response.answer,sources:response.sources||[]});app.me.used=response.usage||app.me.used;}
 }catch(e){app.messages.push({id:newId(),role:'assistant',content:'Не удалось выполнить запрос: '+e.message});}finally{app.busy=false;renderChat();}}
async function awaitVideo(jobId,prompt){for(let i=0;i<70;i++){await new Promise(ok=>setTimeout(ok,8500));try{const j=await api('/api/video/status',{jobId});if(j.status==='ready'){const target=app.messages.find(m=>m.jobId===jobId);if(target){target.content='Видео готово!';target.kind='video';target.media_url=j.url;}renderChat();return;}if(j.status==='failed'){notify(j.error||'Не удалось создать видео.');return;}}catch(e){if(i>3){notify('Проверку видео можно продолжить в «Истории».');return;}}}}

e wide" style="margin-top:12px" id="download-result">Скачать фотографию</button>`:`<video controls playsinline src="${esc(app.result.url)}"></video><a href="${esc(app.result.url)}" class="outline" target="_blank" rel="noreferrer" style="display:block;text-align:center;margin-top:11px">Открыть видео</a>`}</div>`:''}${app.loadingHint&&app.working?`<p class="tiny">${esc(app.loadingHint)}</p>`:''}`;

async function startStudio(){app.prompt=$('studio-prompt').value.trim();if(app.prompt.length<6)return notify('Добавь описание.');if(app.working)return;app.working=true;app.result=null;app.loadingHint='Генерация';renderCreate();const mode=app.mode,ref=app.reference,prompt=app.prompt;

async function localSave(id,url,prompt){return new Promise((ok,no)=>{const r=indexedDB.open('aurora-nova-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('items');r.onerror=()=>no(r.error);r.onsuccess=()=>{const db=r.result,t=db.transaction('items','readwrite');t.objectStore('items').put({id,url,prompt,at:now(),kind:'image'},`${app.me?.user?.id||'demo'}:${id}`);t.oncomplete=()=>{db.close();ok()};t.onerror=()=>no(t.error);}});}
async function localList(){return new Promise((ok,no)=>{const r=indexedDB.open('aurora-nova-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('items');r.onerror=()=>no(r.error);r.onsuccess=()=>{const db=r.result,out=[],q=db.transaction('items').objectStore('items').openCursor();q.onsuccess=()=>{const c=q.result;if(!c){db.close();ok(out.sort((a,b)=>b.at-a.at).slice(0,30));return;}if(String(c.key).startsWith(`${app.me?.user?.id||'demo'}:`))out.push(c.value);c.continue()};q.onerror=()=>no(q.error);}});}

async function imageFromFile(file,limit=1100){if(!file||!file.type.startsWith('image/'))throw Error('Нужна фотография JPEG, PNG или WEBP.');if(file.size>12e6)throw Error('Максимум 12 МБ.');const url=URL.createObjectURL(file);try{const im=await new Promise((ok,no)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=()=>no(Error('Не удалось открыть фото'));x.src=url;});const scale=Math.min(1,limit/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.67);}finally{URL.revokeObjectURL(url)}}
async function fileToBase64(file){return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('Ошибка чтения'));r.readAsDataURL(file)});}
async function pickChatFile(file){if(!file)return;try{if(file.type.startsWith('image/'))app.attached={kind:'image',data:await imageFromFile(file),name:file.name};else if(file.type==='application/pdf'&&file.size<1.7e6)app.attached={kind:'pdf',data:await fileToBase64(file),name:file.name};else if(/\.(txt|md|csv)$/i.test(file.name)&&file.size<350000){const t=await file.text();prepareText(t.slice(0,2600));return;}else throw Error('Поддерживаются фото, PDF до 1.7 МБ, TXT, MD, CSV.');renderChat();}catch(e){notify(e.message);}}

yle="margin-top:10px">На сервере настроены общие защитные лимиты, даже для владельца и PRO.</p></div><div class="eyebrow">ПОСЛЕДНИЕ ПОЛЬЗОВАТЕЛИ</div><div class="admin-list">${(a.users||[]).map(u=>`<button class="admin-user" data-person="${esc(u.id)}"><span><b>${esc(u.name)}</b> ${u.username?'@'+esc(u.username):''}<br><small>${esc(u.id)} ${u.expires_at>now()?'· PRO':''}</small></span>${icon('copy')}</button>`).join('')}</div>`;}
async function adminChange(key,value){if(key==='video'&&value&&!confirm('Видео расходует баланс fal.ai. Включить его для PRO и владельца?'))return;try{const r=await api('/api/admin/settings',{key,value});app.admin.settings=r.settings;renderAdmin();notify('Настройка сохранена.');}catch(e){notify(e.message);}}
async function adminGift(revoke){const target=$('gift-user')?.value.trim(),days=Number($('gift-days')?.value||30);if(!target)return notify('Укажи Telegram ID или @username.');if(revoke&&!confirm('Отозвать PRO у пользователя?'))return;try{const result=await api('/api/admin/grant',{target,days,revoke});notify(revoke?'PRO отозван.':`Подарена подписка до ${new Date(result.expiresAt).toLocaleDateString('ru-RU')}`);void loadAdmin();}catch(e){notify(e.message);}}
async function loadMe(){try{app.me=await api('/api/me');$('plan-chip').textContent=plan();renderHome();renderChat();renderProfile();}catch(e){notify(e.message);renderChat();}}
let voiceRecognizer=null;
let voiceFinal='';
let voiceActive=false;
function showVoice(){voiceFinal='';$('voice-transcript').textContent='';$('voice-status').textContent='Нажми на микрофон для записи';setTab('voice');}
function stopVoice(){if(voiceRecognizer){try{voiceRecognizer.stop()}catch(e){}voiceRecognizer=null;}voiceActive=false;$('voice-orb').classList.remove('listening');$('voice-mic').classList.remove('listening');}
function toggleVoice(){if(voiceActive){stopVoice();$('voice-status').textContent='Запись остановлена. Перенеси текст в диалог.';return;}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$('voice-status').textContent='Голосовой ввод недоступен в этом браузере.';$('voice-transcript').textContent='Можно использовать микрофон на клавиатуре iPhone для диктовки сообщения.';return;}
 const rec=new SR();voiceRecognizer=rec;rec.lang='ru-RU';rec.interimResults=true;rec.continuous=true;
 rec.onstart=()=>{voiceActive=true;$('voice-orb').classList.add('listening');$('voice-mic').classList.add('listening');$('voice-status').textContent='Слушаю тебя…';};
 rec.onresult=e=>{let part='';for(let i=e.resultIndex;i<e.results.length;i++){const v=e.results[i][0]?.transcript||'';if(e.results[i].isFinal)voiceFinal+=(voiceFinal?' ':'')+v;else part+=v+' ';}$('voice-transcript').textContent=voiceFinal+(part?' '+part:'');};
 rec.onerror=e=>{$('voice-status').textContent=e.error==='not-allowed'?'Разреши доступ к микрофону в настройках.':'Распознавание недоступно: '+e.error;stopVoice();};
 rec.onend=()=>{voiceActive=false;$('voice-orb').classList.remove('listening');$('voice-mic').classList.remove('listening');if(voiceFinal)$('voice-status').textContent='Запись завершена — текст готов';};
 try{rec.start();}catch(e){$('voice-status').textContent='Не удалось начать запись';stopVoice();}}
function voiceToChat(){const v=$('voice-transcript').textContent.trim();stopVoice();setTab('chat');if(v){$('message').value=($('message').value+' '+v).trim();$('message').focus();}else notify('Сначала продиктуй запрос.');}

function setSafe(){const n=Math.max(Number(tg?.safeAreaInset?.top||0),Number(tg?.contentSafeAreaInset?.top||0));document.documentElement.style.setProperty('--safe',`${Math.min(55,Math.max(0,n))}px`);}
function init(){tg?.ready?.();tg?.expand?.();tg?.setHeaderColor?.('#1b0920');tg?.setBackgroundColor?.('#120715');tg?.onEvent?.('safeAreaChanged',setSafe);tg?.onEvent?.('contentSafeAreaChanged',setSafe);setSafe();$('header-new').innerHTML=icon('plus');$('header-library').innerHTML=icon('clock');$('attach').innerHTML=icon('plus');$('send').innerHTML=icon('send');$('voice-open').innerHTML=icon('mic');$('voice-mic').innerHTML=icon('mic');document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));renderHome();renderChat();renderCreate();renderProfile();setTab('home');void loadMe();}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('header-new').addEventListener('click',newChat);$('header-library').addEventListener('click',()=>setTab('library'));$('voice-open').addEventListener('click',showVoice);$('voice-back').onclick=()=>{stopVoice();setTab('chat')};$('voice-cancel').onclick=()=>{stopVoice();setTab('chat')};$('voice-to-chat').onclick=voiceToChat;$('voice-mic').onclick=toggleVoice;$('send').addEventListener('click',()=>void send());$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();void send();}});$('web-search').onclick=()=>{app.web=!app.web;renderChat();};$('attach').onclick=()=>$('chat-file').click();$('chat-file').onchange=e=>{void pickChatFile(e.target.files[0]);e.target.value='';};$('create-file').onchange=e=>{void imageFromFile(e.target.files[0],900).then(url=>{app.reference=url;renderCreate();}).catch(x=>notify(x.message));e.target.value='';};
$('attached').addEventListener('click',e=>{if(e.target.closest('#clear-file')){app.attached=null;renderChat();}});
$('chat-stream').addEventListener('click',e=>{const sug=e.target.closest('[data-prompt]');if(sug){prepareText(sug.dataset.prompt);return;}const cp=e.target.closest('[data-copy]');if(cp){const m=app.messages.find(x=>x.id===cp.dataset.copy);if(m){void navigator.clipboard.writeText(m.content).then(()=>notify('Скопировано.')).catch(()=>notify('Копирование недоступно.'));}return;}const d=e.target.closest('[data-download]');if(d){const img=app.images.find(a=>a.id===d.dataset.download);if(img)download(img.url);}});
$('view-home').addEventListener('click',e=>{
 if(e.target.closest('#home-new')){newChat();return;}
 const quick=e.target.closest('[data-quick]');if(quick){newChat();$('message').value=quick.dataset.quick;setTab('chat');$('message').focus();return;}
 const item=e.target.closest('[data-home]');if(!item)return;const mode=item.dataset.home;
 if(mode==='chat'){setTab('chat');return;}
 if(mode==='image'||mode==='video'){app.mode=mode;app.prompt='';app.reference=null;app.result=null;setTab('create');return;}
 setTab(mode==='profile'?'profile':'library');
});
$('view-create').addEventListener('click',e=>{const mode=e.target.closest('[data-mode]');if(mode){app.prompt=$('studio-prompt')?.value||app.prompt;app.mode=mode.dataset.mode;app.result=null;app.reference=null;app.prompt='';renderCreate();return;}const ratio=e.target.closest('[data-ratio]');if(ratio){app.prompt=$('studio-prompt')?.value||app.prompt;if(app.mode==='image')app.ratio=ratio.dataset.ratio;else app.videoRatio=ratio.dataset.ratio;renderCreate();return;}if(e.target.closest('#open-create-file')){$('create-file').click();return;}if(e.target.closest('#remove-create-file')){app.reference=null;app.prompt=$('studio-prompt')?.value||app.prompt;renderCreate();return;}if(e.target.closest('#launch-studio')){void startStudio();return;}if(e.target.closest('#download-result')&&app.result?.kind==='image'){download(app.result.url);}});
$('view-create').addEventListener('input',e=>{if(e.target.id==='studio-prompt'){app.prompt=e.target.value;const b=$('launch-studio');if(b)b.disabled=app.prompt.trim().length<6||app.working;}});
$('view-library').addEventListener('click',e=>{const th=e.target.closest('[data-open-thread]');if(th){void api('/api/thread',{threadId:th.dataset.openThread}).then(r=>{app.threadId=r.thread.id;app.messages=(r.messages||[]).map(x=>({id:x.id,role:x.role,content:x.content,kind:x.kind,media_url:x.media_url}));setTab('chat');renderChat();}).catch(x=>notify(x.message));return;}const del=e.target.closest('[data-delete-thread]');if(del){if(!confirm('Удалить этот диалог?'))return;void api('/api/thread/delete',{threadId:del.dataset.deleteThread}).then(()=>{if(app.threadId===del.dataset.deleteThread)newChat();void loadLibrary();}).catch(x=>notify(x.message));return;}const dl=e.target.closest('[data-download]');if(dl){const a=app.images.find(x=>x.id===dl.dataset.download);if(a)download(a.url);return;}const refresh=e.target.closest('[data-refresh-video]');if(refresh){void api('/api/video/status',{jobId:refresh.dataset.refreshVideo}).then(()=>loadLibrary()).catch(x=>notify(x.message));}});
$('view-profile').addEventListener('click',e=>{if(e.target.closest('#open-admin')){setTab('admin');return;}if(e.target.closest('#open-library-from-profile')){setTab('library');return;}});
$('view-admin').addEventListener('click',e=>{const flag=e.target.closest('[data-flag]');if(flag){void adminChange(flag.dataset.flag,!app.admin.settings[flag.dataset.flag]);return;}const gift=e.target.closest('#gift-pro');if(gift){void adminGift(false);return;}if(e.target.closest('#revoke-pro')){void adminGift(true);return;}const person=e.target.closest('[data-person]');if(person){const field=$('gift-user');if(field){field.value=person.dataset.person;field.focus();}return;}});
init();
</script></body></html>
