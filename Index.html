hite-space:pre-line;font-size:12px}.preview-card .stamp{font-size:10px;letter-spacing:1.3px;font-weight:800;color:#806298}.preview-card.pink{background:linear-gradient(140deg,#ffe7f3,#f8cce7)}.preview-card.pearl{background:linear-gradient(140deg,#fff,#eae4f7)}.preview-card .fake-product{display:grid;place-items:center;height:230px;border-radius:14px;background:#fff8;color:#9b79c9;font-size:52px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #f0eaf3}.setting-row:last-child{border-bottom:0}.setting-row strong{font-size:12px;font-weight:800}.setting-row small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.setting-link{display:flex;align-items:center;text-align:left;width:100%;background:transparent;border:0;border-bottom:1px solid #f0eaf3;padding:14px 1px;gap:12px;color:var(--ink)}.setting-link:last-child{border-bottom:0}.setting-link .icon-disc{height:37px;width:37px;border-radius:12px;margin:0}.setting-link .meta{flex:1;min-width:0}.setting-link strong{font-size:12px}.setting-link small{font-size:10px;display:block;margin-top:2px;color:var(--muted)}.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:9px 13px calc(9px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,#f8f6fa 45%,#f8f6fac9 90%);pointer-events:none}.bottom-inner{pointer-events:auto;max-width:535px;margin:auto;display:flex;padding:7px;background:#fffc;border:1px solid #e5dcea;border-radius:24px;box-shadow:0 12px 42px #4c2e6721;backdrop-filter:blur(16px)}.nav-tab{display:flex;flex:1;min-width:0;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:9px 2px;background:transparent;border:0;border-radius:17px;color:#9e8fac;font-size:10px;font-weight:800}.nav-tab .ui-icon{width:21px;height:21px}.nav-tab.active{color:#8e5bc5;background:#f5edfa}.nav-tab.active .ui-icon{stroke-width:2.2}.hide{display:none!important}.hidden-input{position:absolute;height:1px;width:1p <body>
<div class="shell"><header class="top" id="top"></header><main id="main"></main></div>
<nav class="bottom"><div class="bottom-inner" id="nav"></div></nav>
<div id="toast" hidden role="status"></div>
<div id="modal-root" class="modal-back" hidden></div>
<input class="hidden-input" id="photo-file" type="file" accept="image/png,image/jpeg,image/webp">
<input class="hidden-input" id="design-file" type="file" accept="image/png,image/jpeg,image/webp">
<script>
'use strict';
const API='https://aurora-ai.artykartunov.workers.dev';
const tg=window.Telegram?.WebApp||null;
try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#f8f6fa')}catch{}
const user=tg?.initDataUnsafe?.user||null;
const USER_KEY='aurora-studio-v18-'+String(user?.id||'browser');
const $=id=>document.getElementById(id);
const safe=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const validImage=s=>typeof s==='string'&&/^data:image\/(png|jpeg|webp);base64,[a-z0-9+/=]+$/i.test(s);
const kindName={text:'AI-текст',photo:'AI-фото',design:'Карточка'};
const state={page:'home',folder:'all',kind:'all',search:'',folders:[],projects:[],synced:false,ready:false,working:false,plan:{plan:'free',billingReady:false,stars:0},owner:false,admin:null,writer:{kind:'ad',title:'',facts:'',audience:'',tone:'warm'},writerText:'',aiDesc:{name:'',features:'',tone:'sales',platform:'marketplace'},aiResult:null,photo:{prompt:'',style:'catalog',ratio:'1:1'},photoReference:null,photoResult:null,photoProjectId:null,designer:{title:'',features:'',price:'',badge:'НОВИНКА',theme:'lavender',format:'4:5'},designerImage:null,saved:[],selected:null};
function notice(s){const el=$('toast');el.textContent=String(s);el.hidden=false;clearTimeout(notice.t);notice.t=setTimeout(()=>el.hidden=true,3400)}
function busy(v){state.working=v;document.querySelectorAll('[data-busy]').forEach(b=>b.disabled=v)}
async function api(path,payload={}){
 if(!tg?.initData)throw Error('Открой Аврору через Telegram-бота, не в обычном браузере.');
 const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,...payload})});
 const data=await r.json().catch(()=>({error:'Неизвестный ответ сервера'}));
 if(!r.ok)throw Error(data.error||`HTTP ${r.status}`);
 return data;
}
function saveLocal(){try{localStorage.setItem(USER_KEY,JSON.stringify({folders:state.folders,projects:state.projects.slice(0,350)}))}catch{}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(USER_KEY)||'{}');state.folders=Array.isArray(d.folders)?d.folders:[];state.projects=Array.isArray(d.projects)?d.projects:[]}catch{}}
function id(){return crypto.randomUUID?.()||'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>(c==='x'?Math.random()*16|0:(Math.random()*4|8)).toString(16))}
async function cacheOpen(){return new Promise((resolve,reject)=>{const q=indexedDB.open('AuroraStudioImages',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('images'))q.result.createObjectStore('images')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function cacheSet(key,value){if(!value)return;try{const db=await cacheOpen();await new Promise((ok,no)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(value,key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});db.close()}catch(e){console.warn('Cache',e)}}
async function cacheGet(key){try{const db=await cacheOpen();const val=await new Promise((ok,no)=>{const tx=db.transaction('images');const q=tx.objectStore('images').get(key);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>no(q.error)});db.close();return val}catch{return null}}
async function cacheDelete(key){try{const db=await cacheOpen();await new Promise((ok,no)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').delete(key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});db.close()}catch{}}
function imageLoad(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(Error('Не удалось прочитать фото'));im.src=src})}
function blobOf(canvas,type,quality){return new Promise(ok=>canvas.toBlob(ok,type,quality))}
async function dataOf(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('Не удалось прочитать файл'));r.readAsDataURL(blob)})}
async function squeeze(source,maxBytes=350000,maxSide=1050){
 const image=await imageLoad(source);
 for(let side=maxSide;side>=440;side=Math.floor(side*.82)){
  const ratio=Math.min(1,side/Math.max(image.naturalWidth,image.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(image.naturalHeight*ratio));
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
  for(const q of [.82,.7,.58,.45,.32]){const blob=await blobOf(canvas,'image/jpeg',q);if(blob&&blob.size<=maxBytes)return dataOf(blob)}
 }
 throw Error('Не удалось сжать фото до 350 КБ');
}
async function cropImage(source,ratio){const target={'1:1':1,'4:5':.8,'9:16':9/16}[ratio];if(!target)return source;const im=await imageLoad(source);const c=document.createElement('canvas');const sw=im.naturalWidth,sh=im.naturalHeight;let w=sw,h=sh;if(sw/sh>target)w=Math.round(sh*target);else h=Math.round(sw/target);c.width=w;c.height=h;c.getContext('2d').drawImage(im,Math.round((sw-w)/2),Math.round((sh-h)/2),w,h,0,0,w,h);return c.toDataURL('image/png')}
async function fileData(file,max=9000000){if(!file||file.size>max||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Нужно JPG, PNG или WEBP до 9 МБ');return dataOf(file)}
async function projectImage(p){let photo=await cacheGet(p.id);if(!photo&&p.imageKey&&state.synced){try{photo=(await api('/studio/images/get',{imageKey:p.imageKey})).image;if(validImage(photo))await cacheSet(p.id,photo)}catch{}}return validImage(photo)?photo:null}
async function saveProject(kind,title,content,fullImage=null,existingId=null){
 const projectId=existingId||id();const previous=state.projects.find(p=>p.id===projectId);
 if(fullImage)await cacheSet(projectId,fullImage);
 let imageKey=previous?.imageKey||null;
 if(fullImage&&state.synced&&!imageKey){
  try{const compressed=await squeeze(fullImage);const response=await api('/studio/images/save',{image:compressed});imageKey=response.imageKey||null}
  catch(e){notice('Фото только на устройстве: '+e.message)}
 }
 const p={id:projectId,kind,title:String(title||'Без названия').slice(0,120),folderId:previous?.folderId||(state.folder==='all'?'':state.folder),content:content||{},imageKey,createdAt:previous?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};

async function clipboard(text){try{await navigator.clipboard.writeText(text);notice('Скопировано')}catch{const el=document.createElement('textarea');el.value=text;document.body.append(el);el.select();document.execCommand('copy');el.remove();notice('Скопировано')}}
function download(src,name){const a=document.createElement('a');a.href=src;a.download=name;document.body.append(a);a.click();a.remove()}
function wrapText(ctx,text,maxWidth){const lines=[];let curr='';for(const word of String(text).split(/\s+/)){const line=curr?curr+' '+word:word;if(ctx.measureText(line).width>maxWidth&&curr){lines.push(curr);curr=word}else curr=line}if(curr)lines.push(curr);return lines}
async function designCanvas(){const d=state.designer;const dims={'1:1':[900,900],'3:4':[900,1200],'4:5':[900,1125]};const [w,h]=dims[d.format]||dims['4:5'];const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');const colors=d.theme==='pink'?['#ffecf6','#f4bddc']:d.theme==='pearl'?['#fffaff','#e7ddf5']:['#f0ddff','#e0c9f8'];const grad=ctx.createLinearGradient(0,0,w,h);grad.addColorStop(0,colors[0]);grad.addColorStop(1,colors[1]);ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.fillStyle='#7449a5';ctx.font='800 24px Manrope, sans-serif';ctx.fillText('AURORA  ✦  AI STUDIO',55,66);
 const y=100,imgH=Math.round(h*.51);ctx.fillStyle='#ffffffbb';ctx.beginPath();ctx.roundRect(44,y,w-88,imgH,28);ctx.fill();if(state.designerImage){const im=await imageLoad(state.designerImage);const scale=Math.min((w-126)/im.width,(imgH-40)/im.height);const ww=im.width*scale,hh=im.height*scale;ctx.drawImage(im,(w-ww)/2,y+(imgH-hh)/2,ww,hh)}
 const start=y+imgH+49;ctx.fillStyle='#9b66bf';ctx.font='800 24px Manrope,sans-serif';ctx.fillText((d.badge||'НОВИНКА').slice(0,24).toUpperCase(),55,start);ctx.fillStyle='#39234d';ctx.font='800 44px Manrope,sans-serif';let yy=start+62;for(const line of wrapText(ctx,d.title||'Название товара',w-105).slice(0,2)){ctx.fillText(line,55,yy);yy+=52}ctx.font='600 24px Manrope,sans-serif';ctx.fillStyle='#6c537c';for(const line of wrapText(ctx,String(d.features||'').replace(/;/g,'  •  '),w-106).slice(0,d.format==='1:1'?2:4)){ctx.fillText(line,55,yy+15);yy+=35}if(d.price){ctx.fillStyle='#8748b5';ctx.font='800 38px Manrope,sans-serif';ctx.fillText(d.price.slice(0,35),55,Math.min(h-77,yy+35))}ctx.fillStyle='#927caa';ctx.font='600 19px Manrope,sans-serif';ctx.fillText('Создано в Аврора Бизнес',55,h-28);return c}

 if(a==='designer-export'){const canvas=await designCanvas();download(canvas.toDataURL('image/png'),'aurora-card-'+state.designer.format.replace(':','x')+'.png');return}
 if(a==='designer-save'){const canvas=await designCanvas();const image=canvas.toDataURL('image/png');const p=await saveProject('design',state.designer.title||'Новая карточка',{...state.designer},image);if(state.designerImage)await cacheSet(p.id+':original',state.designerImage);notice('Карточка сохранена');return}
 if(a==='folder-add'){const name=$('new-folder')?.value.trim()||'';if(name.length<2||name.length>45)throw Error('Название папки: 2–45 символов');const folder={id:id(),name,createdAt:new Date().toISOString()};if(state.synced){const x=await api('/studio/folders/save',folder);folder.id=x.id||folder.id}state.folders.push(folder);saveLocal();render();notice('Папка создана');return}
 if(a==='folder-delete'){if(!await uiConfirm('Удалить папку? Проекты останутся в библиотеке без папки.'))return;const pid=state.folder;if(state.synced)await api('/studio/folders/delete',{id:pid});state.folders=state.folders.filter(f=>f.id!==pid);state.projects.forEach(p=>{if(p.folderId===pid)p.folderId='' });state.folder='all';saveLocal();render();return}
 if(a==='project-open'){await openProject(arg.id);return}
 if(a==='project-edit'){const p=state.selected;if(!p)return;const c=p.content||{};if(p.kind==='photo'){const image=await projectImage(p);state.photoResult=image;state.photoProjectId=p.id;state.photo={prompt:c.prompt||p.title,style:c.style||'catalog',ratio:c.ratio||'1:1'};setPage('photos')}else if(p.kind==='design'){state.designer={...state.designer,...c};state.designerImage=await cacheGet(p.id+':original');setPage('designer');if(!state.designerImage)notice('Исходное фото недоступно на этом устройстве: загрузи его снова')}else{if(c.source==='description'){state.aiDesc={...state.aiDesc,name:c.name||p.title,features:c.features||'',platform:c.platform||'marketplace',tone:c.tone||'sales'};state.aiResult={title:p.title,description:c.result||'',post:c.post||'',needsReview:[]};setPage('description')}else{state.writer={...state.writer,title:c.title||p.title,facts:c.facts||'',audience:c.audience||'',tone:c.tone||'warm',kind:c.kind||'ad'};state.writerText=c.result||'';setPage('writer')}}return}
 if(a==='project-delete'){if(!await uiConfirm('Удалить проект? Это действие нельзя отменить.'))return;const p=state.projects.find(p=>p.id===arg.id);if(state.synced)await api('/studio/projects/delete',{id:arg.id});state.projects=state.projects.filter(p=>p.id!==arg.id);await cacheDelete(arg.id);saveLocal();setPage(state.page==='detail'?'projects':state.page);notice('Проект удалён');return}
 if(a==='detail-download'){const image=await projectImage(state.selected);if(image)download(image,'aurora-'+state.selected.id+'.png');return}
 if(a==='detail-copy'){await clipboard(state.selected?.content?.result||'');return}
 if(a==='saved-copy'){const card=state.saved.find(x=>x.id===arg.id);if(card)await clipboard(card.title+'\n\n'+card.description+'\n\n'+card.post);return}
 if(a==='saved-delete'){if(!await uiConfirm('Удалить сохранённую карточку?'))return;await api('/business/cards/delete',{id:arg.id});await loadSaved();return}
 if(a==='pro-buy'){if(!state.plan.billingReady)throw Error('Оплата PRO пока не настроена');if(!tg?.openInvoice)throw Error('Открой Аврору в Telegram');const x=await api('/business/billing/invoice',{product:'pro_30d'});tg.openInvoice(x.invoiceLink,async status=>{if(status==='paid'){await refreshPlan();render();notice('Оплата отправлена, проверяем статус')}else if(status==='failed')notice('Платёж не прошёл')});return}
 if(a==='support-send'){const subject=$('support-subject')?.value.trim();const message=$('support-text')?.value.trim();await api('/support/create',{subject,message});$('support-subject').value='';$('support-text').value='';notice('Обращение отправлено');return}
 if(a==='admin-toggle'){const next=!state.admin.settings[arg.key];if(!await uiConfirm('Изменить эту настройку сервиса?'))return;await api('/admin/update',{key:arg.key,value:next});await loadAdmin();notice('Настройка изменена');return}
 if(a==='admin-reply'){const ticket=(state.admin?.tickets||[]).find(t=>t.id===arg.id);if(!ticket)throw Error('Обращение не найдено');const text=await replyDialog(ticket);if(!text)return;await api('/admin/ticket/reply',{id:arg.id,message:text});await loadAdmin();notice('Ответ отправлен');return}
 if(a==='admin-close'){await api('/admin/ticket/status',{id:arg.id,status:'closed'});await loadAdmin();return}
 };run(act)});
async function start(){loadLocal();render();if(tg?.initData){await Promise.all([refreshLibrary(),refreshPlan(),checkOwner()]);}state.ready=true;render()}
start().catch(e=>notice(e.message));
</script>
</body>
</html>
