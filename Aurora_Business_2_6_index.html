<body>
<div class="shell"><header class="top" id="top"></header><main id="main"></main></div>

<div id="toast" hidden role="status"></div>

<script>
'use strict';

/* Aurora Business: prevent accidental page/text zoom on iPhone Telegram.
   Keep native scrolling and selection/editing inside text fields. */
(function preventInAppZoom(){
  const prevent=e=>{if(e.cancelable)e.preventDefault();};
  for(const eventName of ['gesturestart','gesturechange','gestureend']){
    document.addEventListener(eventName,prevent,{passive:false,capture:true});
  }
  document.addEventListener('touchmove',e=>{
    if(e.touches.length>1)prevent(e);
  },{passive:false,capture:true});
  let lastTapTime=0;
  document.addEventListener('touchend',e=>{
    if(e.changedTouches.length!==1)return;
    const element=e.target instanceof Element?e.target:null;
    if(element?.closest('input,textarea,select,[contenteditable]')){
      lastTapTime=0;
      return; // Keep cursor placement, native copy/paste and text selection.
    }
    const now=Date.now();
    if(now-lastTapTime<300){
      prevent(e);
      lastTapTime=0;
    }else{
      lastTapTime=now;
    }
  },{passive:false,capture:true});
  document.addEventListener('dblclick',e=>{
    const element=e.target instanceof Element?e.target:null;
    if(!element?.closest('input,textarea,select,[contenteditable]'))prevent(e);
  },{passive:false,capture:true});
})();

const API='https://aurora-ai.artykartunov.workers.dev';
const tg=window.Telegram?.WebApp||null;
try{tg?.ready();tg?.expand();tg?.disableVerticalSwipes?.();tg?.setHeaderColor?.('#faf1ff')}catch{}
const user=tg?.initDataUnsafe?.user||null;
// Aurora Business 2.4.1: protect the top of the page in Telegram fullscreen.
// Some iOS Telegram builds report zero safe-area insets or delay isFullscreen.
// Detect the fullscreen webview too; never add this offset in the normal Mini App sheet.
let auroraFullscreenDetected=false;
function auroraSyncTelegramSafeArea(){
  const contentTop=Math.max(0,Number(tg?.contentSafeAreaInset?.top)||0);
  const systemTop=Math.max(0,Number(tg?.safeAreaInset?.top)||0);
  const screenHeight=Math.max(Number(window.screen?.height)||0,Number(window.screen?.availHeight)||0);
  // innerHeight is a layout viewport: unlike visualViewport.height it normally
  // remains stable while the keyboard is visible on iOS.
  const layoutHeight=Number(window.innerHeight)||0;
  const fillsScreen=!!tg && screenHeight>0 && layoutHeight>=screenHeight-80;
  const nativeFullscreen=!!tg?.isFullscreen;
  const insetShowsOverlay=!!tg && contentTop>=48;
  if(nativeFullscreen||fillsScreen||insetShowsOverlay)auroraFullscreenDetected=true;
  // Telegram's native Close/Menu pill occupies more than the iPhone status bar.
  // Reserve at least 84 CSS px above our brand header in fullscreen.
  const extra=auroraFullscreenDetected?Math.max(84,contentTop,systemTop):0;
  document.documentElement.style.setProperty('--aur-tg-top',Math.min(160,Math.round(extra))+'px');
}
auroraSyncTelegramSafeArea();
try{
  tg?.onEvent?.('safeAreaChanged',auroraSyncTelegramSafeArea);
  tg?.onEvent?.('contentSafeAreaChanged',auroraSyncTelegramSafeArea);
  tg?.onEvent?.('fullscreenChanged',auroraSyncTelegramSafeArea);
  tg?.onEvent?.('viewportChanged',auroraSyncTelegramSafeArea);
}catch{}
window.addEventListener('resize',auroraSyncTelegramSafeArea,{passive:true});
requestAnimationFrame(auroraSyncTelegramSafeArea);
setTimeout(auroraSyncTelegramSafeArea,350);
setTimeout(auroraSyncTelegramSafeArea,1100);

const USER_KEY='aurora-studio-v18-'+String(user?.id||'browser');
const $=id=>document.getElementById(id);

// Hide the fixed navigation while the iOS/Telegram keyboard is being used.
function aurEditable(el){
  return el instanceof Element && Boolean(el.closest('input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),textarea,select,[contenteditable="true"]'));
}
function aurUpdateKeyboard(){
  const focused=aurEditable(document.activeElement);
  const vv=window.visualViewport;
  const hiddenHeight=vv?Math.max(0,window.innerHeight-vv.height-vv.offsetTop):0;
  document.documentElement.classList.toggle('aur-keyboard-open',focused||hiddenHeight>130);
}
document.addEventListener('focusin',e=>{if(aurEditable(e.target))document.documentElement.classList.add('aur-keyboard-open')});
document.addEventListener('focusout',()=>{requestAnimationFrame(aurUpdateKeyboard);setTimeout(aurUpdateKeyboard,120)});
window.visualViewport?.addEventListener('resize',aurUpdateKeyboard);
window.visualViewport?.addEventListener('scroll',aurUpdateKeyboard);
window.addEventListener('resize',aurUpdateKeyboard);

const safe=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const validImage=s=>typeof s==='string'&&/^data:image\/(png|jpeg|webp);base64,[a-z0-9+/=]+$/i.test(s);
const kindName={text:'AI-текст',photo:'AI-фото',design:'Карточка'};
const state={assistant:{threads:[],active:null,messages:[],memory:'',draft:'',loaded:false,loading:false,error:''},planner:{tasks:[],notes:[]},finance:{revenue:'',costs:'',orders:''},documentText:'',photoMode:'quick',photoExample:-1,photoEdit:{filter:'original',ratio:'1:1',frame:'none'},page:'home',folder:'all',kind:'all',search:'',folders:[],projects:[],synced:false,ready:false,working:false,plan:{plan:'free',billingReady:false,stars:0},owner:false,admin:null,writer:{kind:'ad',title:'',facts:'',audience:'',tone:'warm'},writerText:'',aiDesc:{name:'',features:'',tone:'sales',platform:'marketplace'},aiResult:null,photo:{prompt:'',style:'catalog',ratio:'1:1'},photoReference:null,photoResult:null,photoProjectId:null,designer:{title:'',features:'',price:'',badge:'НОВИНКА',theme:'lavender',format:'4:5'},designerImage:null,saved:[],selected:null,giftQuery:'',giftUser:null,giftDays:'30'};
function notice(s){const el=$('toast');el.textContent=String(s);el.hidden=false;clearTimeout(notice.t);notice.t=setTimeout(()=>el.hidden=true,3400)}
function busy(v){state.working=v;document.querySelectorAll('[data-busy]').forEach(b=>b.disabled=v)}
async function api(path,payload={}){
 if(!tg?.initData)throw Error('Открой Аврору через Telegram-бота, не в обычном браузере.');
 const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,...payload})});
 const data=await r.json().catch(()=>({error:'Неизвестный ответ сервера'}));
 if(!r.ok)throw Error(data.error||`HTTP ${r.status}`);
 return data;
}
function saveLocal(){try{localStorage.setItem(USER_KEY,JSON.stringify({folders:state.folders,projects:state.projects.slice(0,350),planner:state.planner,finance:state.finance}))}catch{}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(USER_KEY)||'{}');state.folders=Array.isArray(d.folders)?d.folders:[];state.projects=Array.isArray(d.projects)?d.projects:[];if(d.planner){state.planner.tasks=Array.isArray(d.planner.tasks)?d.planner.tasks.slice(0,100):[];state.planner.notes=Array.isArray(d.planner.notes)?d.planner.notes.slice(0,50):[]}if(d.finance&&typeof d.finance==='object')state.finance={...state.finance,...d.finance}}catch{}}
function id(){return crypto.randomUUID?.()||'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>(c==='x'?Math.random()*16|0:(Math.random()*4|8)).toString(16))}
async function cacheOpen(){return new Promise((resolve,reject)=>{const q=indexedDB.open('AuroraStudioImages',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('images'))q.result.createObjectStore('images')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function cacheSet(key,value){if(!value)return;try{const db=await cacheOpen();await new Promise((ok,no)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(value,key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});db.close()}catch(e){console.warn('Cache',e)}}
async function cacheGet(key){try{const db=await cacheOpen();const val=await new Promise((ok,no)=>{const tx=db.transaction('images');const q=tx.objectStore('images').get(key);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>no(q.error)});db.close();return val}catch{return null}}
async function cacheDelete(key){try{const db=await cacheOpen();await new Promise((ok,no)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').delete(key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});db.close()}catch{}}
function imageLoad(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(Error('Не удалось прочитать фото'));im.src=src})}
function blobOf(canvas,type,quality){return new Promise(ok=>canvas.toBlob(ok,type,quality))}
async function dataOf(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('Не удалось прочитать файл'));r.readAsDataURL(blob)})}
async function squeeze(source,maxBytes=350000,maxSide=1050){
 const image=await imageLoad(source);
 for(let side=maxSide;side>=440;side=Math.floor(side*.82)){
  const ratio=Math.min(1,side/Math.max(image.naturalWidth,image.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(image.naturalHeight*ratio));
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
  for(const q of [.82,.7,.58,.45,.32]){const blob=await blobOf(canvas,'image/jpeg',q);if(blob&&blob.size<=maxBytes)return dataOf(blob)}
 }
 throw Error('Не удалось сжать фото до 350 КБ');
}
async function cropImage(source,ratio){const target={'1:1':1,'4:5':.8,'9:16':9/16}[ratio];if(!target)return source;const im=await imageLoad(source);const c=document.createElement('canvas');const sw=im.naturalWidth,sh=im.naturalHeight;let w=sw,h=sh;if(sw/sh>target)w=Math.round(sh*target);else h=Math.round(sw/target);c.width=w;c.height=h;c.getContext('2d').drawImage(im,Math.round((sw-w)/2),Math.round((sh-h)/2),w,h,0,0,w,h);return c.toDataURL('image/png')}
async function fileData(file,max=9000000){if(!file||file.size>max||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Нужно JPG, PNG или WEBP до 9 МБ');return dataOf(file)}
async function projectImage(p){let photo=await cacheGet(p.id);if(!photo&&p.imageKey&&state.synced){try{photo=(await api('/studio/images/get',{imageKey:p.imageKey})).image;if(validImage(photo))await cacheSet(p.id,photo)}catch{}}return validImage(photo)?photo:null}
async function saveProject(kind,title,content,fullImage=null,existingId=null){
 const projectId=existingId||id();const previous=state.projects.find(p=>p.id===projectId);
 if(fullImage)await cacheSet(projectId,fullImage);
 let imageKey=previous?.imageKey||null;
 if(fullImage&&state.synced&&!imageKey){
  try{const compressed=await squeeze(fullImage);const response=await api('/studio/images/save',{image:compressed});imageKey=response.imageKey||null}
  catch(e){notice('Фото только на устройстве: '+e.message)}
 }
 const p={id:projectId,kind,title:String(title||'Без названия').slice(0,120),folderId:previous?.folderId||(state.folder==='all'?'':state.folder),content:content||{},imageKey,createdAt:previous?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
 if(state.synced){try{const response=await api('/studio/projects/save',{project:p});p.id=response.id||p.id}catch(e){notice('Проект пока локальный: '+e.message)}}
 const i=state.projects.findIndex(x=>x.id===p.id);if(i<0)state.projects.unshift(p);else state.projects[i]=p;saveLocal();return p;
}
async function refreshLibrary(){if(!tg?.initData)return;try{const d=await api('/studio/library');state.folders=Array.isArray(d.folders)?d.folders:[];state.projects=Array.isArray(d.projects)?d.projects:[];state.synced=true;saveLocal()}catch(e){state.synced=false;notice('Локальный режим: '+e.message)}}
async function refreshPlan(){if(!tg?.initData)return;try{state.plan=await api('/business/billing/status')}catch{}}
async function checkOwner(){if(!tg?.initData)return;try{state.admin=await api('/admin/overview');state.owner=true}catch{state.owner=false}}
function heading(name,sub){return `<header class="page-title"><h1>${safe(name)}</h1><p class="small muted">${safe(sub)}</p></header>`}
function blank(symbol,title,sub){return `<div class="glass empty"><div class="symbol">${symbol}</div><h3>${safe(title)}</h3><p class="small muted">${safe(sub)}</p></div>`}

function tabs(){
 const entries=[['home','Главная','home'],['ai','Aurora AI','sparkle'],['tools','Инструменты','grid'],['projects','Проекты','folder'],['profile','Профиль','user']];
 const active=['description','writer','designer','photos','tools','planner','analytics','documents','marketing','competitors'].includes(state.page)?'tools':['detail','saved','projects'].includes(state.page)?'projects':['pro','support','admin','inbox','profile'].includes(state.page)?'profile':['ai','aiHistory'].includes(state.page)?'ai':'home';
 return entries.map(([page,label,icon])=>`<button class="nav-tab ${active===page?'active':''}" data-act="page" data-page="${page}" aria-label="${label}" ${active===page?'aria-current="page"':''}><span class="nav-icon">${ico(icon)}</span><span>${label}</span></button>`).join('');
}
function feature(page,icon,title,description){return `<button class="aur-feature" data-act="page" data-page="${page}"><span class="symbol">${ico(icon)}</span><strong>${title}</strong>${description?`<small>${description}</small>`:''}</button>`}
function home(){
 const name=user?.first_name||'друг';
 const recent=state.projects.slice(0,2),todo=state.planner.tasks.filter(t=>!t.done).length;
 return `<div class="aur-kicker">ТВОЁ РАБОЧЕЕ ПРОСТРАНСТВО</div><h1 class="aur-greeting">Привет, <em>${safe(name)}</em> ✦</h1>
 <p class="aur-subtitle">Одна красивая студия для идей, проектов и ежедневных задач бизнеса.</p>
 <section class="aur-new-hero"><span class="eyebrow">AURORA INTELLIGENCE</span><h2>Твои идеи.<br>Новые возможности.</h2><p>Спроси Аврору, создай текст или начни новый проект.</p><button class="btn" data-act="page" data-page="ai">Открыть Aurora AI ${ico('arrow','small-icon')}</button></section>
 <div class="aur-stats"><div class="aur-stat"><strong>${state.projects.length}</strong><small>Мои проекты</small></div><div class="aur-stat"><strong>${todo}</strong><small>Задачи в работе</small></div><div class="aur-stat"><strong>${state.plan.plan==='pro'?'PRO':'FREE'}</strong><small>Мой тариф</small></div></div>
 <h2 class="aur-section-title">Начни с главного</h2><div class="aur-feature-grid">
 ${feature('description','pen','Описание товара','Тексты для магазинов')}
 ${feature('photos','image','Visual Lab','Обработка и AI-фото')}
 ${feature('planner','check','Мои задачи','План на сегодня')}
 ${feature('writer','type','Копирайтер','Реклама и посты')}
 </div>
 ${recent.length?`<div class="section"><h2>Недавние проекты</h2><button class="aur-plain-link" data-act="page" data-page="projects">Все ${ico('arrow','small-icon')}</button></div><div class="glass aur-recent">${recent.map(projectRow).join('')}</div>`:''}
 <p class="aur-ai-note">Создавай и сохраняй. AI-запросы требуют доступного баланса OpenAI API.</p>`;
}
function ai(){
 const a=state.assistant,items=a.messages||[];
 return `<div class="aur-ai-head"><div><h1>Aurora AI <span style="color:#ab85c1">✦</span></h1><small>${a.active?'Личный диалог':'Твой интеллектуальный помощник'}</small></div><div class="aur-ai-buttons"><button class="icon-btn" data-act="ai-history" aria-label="История чатов" title="История">${ico('clock')}</button><button class="icon-btn" data-act="ai-memory" aria-label="Память" title="Память">${ico('layers')}</button><button class="icon-btn" data-act="ai-new" aria-label="Новый чат" title="Новый чат">${ico('plus')}</button></div></div>
 ${!items.length?`<div class="aur-ai-intro"><div class="aur-ai-mark">✦</div><h2>Чем могу помочь?</h2><p>От идеи до готового текста — я рядом, когда нужна ясность и вдохновение.</p></div><div class="aur-ai-presets">
 <button data-act="ai-preset" data-prompt="Придумай 5 практичных идей продвижения моего товара.">${ico('sparkle')}Идеи для бизнеса</button>
 <button data-act="ai-preset" data-prompt="Помоги написать красивый и понятный пост для Telegram-магазина. Сначала уточни товар.">${ico('pen')}Текст для поста</button>
 <button data-act="ai-preset" data-prompt="Помоги составить простой план задач на ближайшие 7 дней для моего бизнеса.">${ico('clock')}План на неделю</button>

async function photoLocalCanvas(){
 if(!state.photoReference)throw Error('Сначала добавь фотографию');
 const im=await imageLoad(state.photoReference),ratio=photoSizeRatio(),long=1440;
 let outWidth,outHeight;
 if(ratio>=.8){outWidth=1080;outHeight=Math.round(outWidth/ratio)}
 else {outHeight=1920;outWidth=Math.round(outHeight*ratio)}
 const canvas=document.createElement('canvas');canvas.width=outWidth;canvas.height=outHeight;
 const ctx=canvas.getContext('2d');if(!ctx)throw Error('Не удалось подготовить изображение');
 const frame=photoFrame(),framePad=frame==='none'?0:Math.round(Math.min(outWidth,outHeight)*.055);
 ctx.fillStyle=frame==='lilac'?'#eee5f5':'#fcfaf9';ctx.fillRect(0,0,outWidth,outHeight);
 const areaW=outWidth-framePad*2,areaH=outHeight-framePad*2;
 const sourceWidth=im.naturalWidth,sourceHeight=im.naturalHeight,targetRatio=areaW/areaH;
 let cropW=sourceWidth,cropH=sourceHeight;
 if(sourceWidth/sourceHeight>targetRatio)cropW=sourceHeight*targetRatio;
 else cropH=sourceWidth/targetRatio;
 ctx.save();ctx.filter=photoStyle();ctx.drawImage(im,(sourceWidth-cropW)/2,(sourceHeight-cropH)/2,cropW,cropH,framePad,framePad,areaW,areaH);ctx.restore();
 return canvas;
}

function wrapText(ctx,text,maxWidth){const lines=[];let curr='';for(const word of String(text).split(/\s+/)){const line=curr?curr+' '+word:word;if(ctx.measureText(line).width>maxWidth&&curr){lines.push(curr);curr=word}else curr=line}if(curr)lines.push(curr);return lines}

async function assistantSend(message){
 const a=state.assistant;
 const text=String(message||$('aur-ai-input')?.value||'').trim();
 if(!text)return notice('Напиши сообщение');
 if(text.length>1500)throw Error('Сообщение слишком длинное');
 if(a.loading)return;
 const threadId=a.active||id();a.draft='';a.error='';a.loading=true;
 a.messages.push({role:'user',content:text});render();
 try{
  const data=await api('/assistant/send',{threadId,message:text});
  a.active=data.threadId||threadId;a.messages.push({role:'assistant',content:data.answer});
  const old=a.threads.find(x=>x.id===a.active);
  if(old){old.updatedAt=new Date().toISOString()}else{a.threads.unshift({id:a.active,title:text.slice(0,55),updatedAt:new Date().toISOString()})}
 }catch(e){a.messages.pop();a.draft=text;a.error=e.message||'AI недоступен'}
 finally{a.loading=false;render();requestAnimationFrame(()=>{$('aur-chat-messages')?.scrollIntoView({block:'end'});if(a.error)$('aur-ai-input')?.focus()})}
}

  if(a==='photo-clear'){state.photoReference=null;render();notice('Исходное фото убрано');return}
  if(a==='photo-filter'){if(!(arg.value in AURORA_PHOTO_FILTERS))return;state.photoEdit.filter=arg.value;render();return}
  if(a==='photo-ratio'){if(!(arg.value in AURORA_PHOTO_FORMATS))return;state.photoEdit.ratio=arg.value;render();return}
  if(a==='photo-frame'){if(!['none','pearl','lilac'].includes(arg.value))return;state.photoEdit.frame=arg.value;render();return}
  if(a==='photo-local-download'){const image=await photoLocalPng();download(image,'aurora-visual-lab-'+state.photoEdit.ratio.replace(':','x')+'.png');return}
  if(a==='photo-local-save'){const image=await photoLocalPng();await saveProject('photo','Обработанное фото '+new Date().toLocaleDateString('ru-RU'),{source:'visual-lab',prompt:'Локальная обработка',filter:state.photoEdit.filter,ratio:state.photoEdit.ratio,frame:state.photoEdit.frame},image);notice('Фото сохранено в проектах');return}
  if(a==='photo-local-card'){state.designerImage=await photoLocalPng();setPage('designer');return}
  if(a==='photo-preset'){
    const presets={
      catalog:['Профессиональная фотография товара для каталога, бело-лавандовый бесшовный фон, точные фактуры, мягкий естественный студийный свет, без текста и посторонних объектов','catalog'],
      premium:['Премиальная предметная фотография товара на светлом каменном подиуме, мягкие лавандовые и кремовые оттенки, изысканный направленный свет, фотореализм, без текста','studio'],
      lifestyle:['Реалистичная рекламная фотография товара в уютном современном светлом интерьере, естественное освещение, чистая композиция, товар в центре внимания, без надписей','lifestyle'],
      creative:['Эстетичная рекламная съёмка товара с мягкими скульптурными формами и пастельными оттенками, минимализм, продуманная композиция, высокое качество, без текста','studio']
    };
    if(!presets[arg.value])return;
    state.photoExample=Object.keys(presets).indexOf(arg.value);state.photo.prompt=presets[arg.value][0];state.photo.style=presets[arg.value][1];render();return;
  }
  if(a==='photo-edit-preset'){
    const prompts={light:'Замени фон исходного фото на чистый нежно-лавандовый студийный фон. Сохрани форму и основные детали товара, мягкий реалистичный свет, без текста.',studio:'Сделай студийное освещение более мягким и профессиональным, добавь деликатные тени, сохрани товар максимально узнаваемым и не добавляй текст.',room:'Помести товар в современный светлый интерьер с естественным освещением, сохрани товар максимально похожим на оригинал, без надписей.'};
    if(!prompts[arg.value])return;state.photo.prompt=prompts[arg.value];render();return;
  }
 if(a==='upload-design'){$('design-file').click();return}
 if(a==='writer-kind'){state.writer.kind=arg.kind;render();return}
 if(a==='folder-pick'){state.folder=arg.id;render();return}
 if(a==='kind-pick'){state.kind=arg.kind;render();return}
 if(a==='inbox-filter'){state.inboxFilter=arg.value;render();return}
 if(a==='admin-refresh'){await loadAdmin();render();notice('Обращения обновлены');return}
 if(a==='sync'){await refreshLibrary();render();notice('Библиотека обновлена');return}
 if(a==='description-generate'){const x=await api('/business/generate',state.aiDesc);state.aiResult=x;render();return}
 if(a==='description-copy'){await clipboard(`${state.aiResult.title}\n\n${state.aiResult.description}\n\n${state.aiResult.post}`);return}
 if(a==='description-save'){await saveProject('text',state.aiResult.title,{source:'description',result:state.aiResult.description,post:state.aiResult.post,platform:state.aiDesc.platform,name:state.aiDesc.name,features:state.aiDesc.features,tone:state.aiDesc.tone});notice('Описание сохранено');return}
 if(a==='description-card'){state.designer.title=state.aiResult.title;state.designer.features=state.aiResult.description.slice(0,420);setPage('designer');return}
 if(a==='writer-generate'){const x=await api('/studio/write',state.writer);state.writerText=x.text||JSON.stringify(x.data||{},null,2);render();return}
 if(a==='writer-copy'){await clipboard(state.writerText);return}
 if(a==='writer-save'){await saveProject('text',state.writer.title||'AI-текст',{source:'writer',result:state.writerText,...state.writer});notice('Текст сохранён');return}
 if(a==='photo-generate'){if(state.photoMode==='rework'&&!state.photoReference)throw Error('Для AI-редактирования сначала загрузи оригинальное фото');if(state.photo.prompt.trim().length<12)throw Error('Опиши желаемую фотографию подробнее');const x=await api('/studio/images/generate',{prompt:state.photo.prompt,style:state.photo.style,aspectRatio:state.photo.ratio,...(state.photoMode==='rework'?{referenceImage:state.photoReference}:{})});if(!validImage(x.image))throw Error('AI вернул неверное изображение');state.photoResult=await cropImage(x.image,state.photo.ratio);state.photoProjectId=null;const saved=await saveProject('photo',state.photo.prompt.slice(0,70),{prompt:state.photo.prompt,style:state.photo.style,ratio:state.photo.ratio},state.photoResult);state.photoProjectId=saved.id;render();notice('AI-фото создано и добавлено в историю');return}
 if(a==='photo-save'){const p=await saveProject('photo',state.photo.prompt.slice(0,70),{prompt:state.photo.prompt,style:state.photo.style,ratio:state.photo.ratio},state.photoResult,state.photoProjectId);state.photoProjectId=p.id;notice('AI-фото добавлено в проекты');return}
 if(a==='photo-design'){state.designerImage=state.photoResult;setPage('designer');return}
 if(a==='photo-download'){download(state.photoResult,'aurora-ai-photo.png');return}
 if(a==='designer-ai'){const x=await api('/studio/write',{kind:'card',title:state.designer.title,facts:state.designer.features});if(x.data){state.designer.title=x.data.title||state.designer.title;state.designer.features=x.data.features||state.designer.features;state.designer.badge=x.data.badge||state.designer.badge}render();return}
 if(a==='designer-export'){const canvas=await designCanvas();download(canvas.toDataURL('image/png'),'aurora-card-'+state.designer.format.replace(':','x')+'.png');return}
 if(a==='designer-save'){const canvas=await designCanvas();const image=canvas.toDataURL('image/png');const p=await saveProject('design',state.designer.title||'Новая карточка',{...state.designer},image);if(state.designerImage)await cacheSet(p.id+':original',state.designerImage);notice('Карточка сохранена');return}
 if(a==='folder-add'){const name=$('new-folder')?.value.trim()||'';if(name.length<2||name.length>45)throw Error('Название папки: 2–45 символов');const folder={id:id(),name,createdAt:new Date().toISOString()};if(state.synced){const x=await api('/studio/folders/save',folder);folder.id=x.id||folder.id}state.folders.push(folder);saveLocal();render();notice('Папка создана');return}
 if(a==='folder-delete'){if(!await uiConfirm('Удалить папку? Проекты останутся в библиотеке без папки.'))return;const pid=state.folder;if(state.synced)await api('/studio/folders/delete',{id:pid});state.folders=state.folders.filter(f=>f.id!==pid);state.projects.forEach(p=>{if(p.folderId===pid)p.folderId='' });state.folder='all';saveLocal();render();return}
 if(a==='project-open'){await openProject(arg.id);return}
 if(a==='project-edit'){const p=state.selected;if(!p)return;const c=p.content||{};if(p.kind==='photo'){const image=await projectImage(p);state.photoResult=c.source==='visual-lab'?null:image;state.photoProjectId=p.id;state.photo={prompt:c.prompt||p.title,style:c.style||'catalog',ratio:c.ratio||'1:1'};if(c.source==='visual-lab'){state.photoReference=image;state.photoMode='quick';state.photoEdit={filter:'original',ratio:c.ratio||'1:1',frame:'none'}}else{state.photoMode='generate'}setPage('photos')}else if(p.kind==='design'){state.designer={...state.designer,...c};state.designerImage=await cacheGet(p.id+':original');setPage('designer');if(!state.designerImage)notice('Исходное фото недоступно на этом устройстве: загрузи его снова')}else{if(c.source==='description'){state.aiDesc={...state.aiDesc,name:c.name||p.title,features:c.features||'',platform:c.platform||'marketplace',tone:c.tone||'sales'};state.aiResult={title:p.title,description:c.result||'',post:c.post||'',needsReview:[]};setPage('description')}else{state.writer={...state.writer,title:c.title||p.title,facts:c.facts||'',audience:c.audience||'',tone:c.tone||'warm',kind:c.kind||'ad'};state.writerText=c.result||'';setPage('writer')}}return}
 if(a==='project-delete'){if(!await uiConfirm('Удалить проект? Это действие нельзя отменить.'))return;const p=state.projects.find(p=>p.id===arg.id);if(state.synced)await api('/studio/projects/delete',{id:arg.id});state.projects=state.projects.filter(p=>p.id!==arg.id);await cacheDelete(arg.id);saveLocal();setPage(state.page==='detail'?'projects':state.page);notice('Проект удалён');return}
 if(a==='detail-download'){const image=await projectImage(state.selected);if(image)download(image,'aurora-'+state.selected.id+'.png');return}
 if(a==='detail-copy'){await clipboard(state.selected?.content?.result||'');return}
 if(a==='saved-copy'){const card=state.saved.find(x=>x.id===arg.id);if(card)await clipboard(card.title+'\n\n'+card.description+'\n\n'+card.post);return}
 if(a==='saved-delete'){if(!await uiConfirm('Удалить сохранённую карточку?'))return;await api('/business/cards/delete',{id:arg.id});await loadSaved();return}
 if(a==='pro-buy'){if(!state.plan.billingReady)throw Error('Оплата PRO пока не настроена');if(!tg?.openInvoice)throw Error('Открой Аврору в Telegram');const x=await api('/business/billing/invoice',{product:'pro_30d'});tg.openInvoice(x.invoiceLink,async status=>{if(status==='paid'){await refreshPlan();render();notice('Оплата отправлена, проверяем статус')}else if(status==='failed')notice('Платёж не прошёл')});return}
 if(a==='support-send'){const subject=$('support-subject')?.value.trim();const message=$('support-text')?.value.trim();await api('/support/create',{subject,message});$('support-subject').value='';$('support-text').value='';notice('Обращение отправлено');return}
 if(a==='admin-pro-find'){
   const username=($('gift-username')?.value||'').trim();
   state.giftQuery=username;state.giftUser=null;
   if(!/^@?[A-Za-z0-9_]{5,32}$/.test(username))throw Error('Укажи Telegram-ник, например @username');
   document.activeElement?.blur?.();
   const result=await api('/admin/pro/lookup',{username});
   state.giftUser=result.user;render();notice('Пользователь найден. Проверь Telegram ID.');return;
 }
 if(a==='admin-pro-grant'){
   const target=state.giftUser;
   if(!target)throw Error('Сначала найди пользователя');
   const days=Number(state.giftDays);
   if(![7,30,90].includes(days))throw Error('Выбери срок подписки');
   if(!await uiConfirm(`Бесплатно выдать PRO на ${days} дней пользователю @${target.username} (Telegram ID ${target.userId})?`))return;
   const result=await api('/admin/pro/grant',{username:target.username,expectedUserId:target.userId,days,requestId:id()});
   state.giftUser=null;await loadAdmin();
   notice('PRO выдан до '+new Date(result.expiresAt).toLocaleDateString('ru-RU'));return;
 }
 if(a==='admin-toggle'){const next=!state.admin.settings[arg.key];if(!await uiConfirm('Изменить эту настройку сервиса?'))return;await api('/admin/update',{key:arg.key,value:next});await loadAdmin();notice('Настройка изменена');return}
 if(a==='admin-reply'){const ticket=(state.admin?.tickets||[]).find(t=>t.id===arg.id);if(!ticket)throw Error('Обращение не найдено');const text=await replyDialog(ticket);if(!text)return;await api('/admin/ticket/reply',{id:arg.id,message:text});await loadAdmin();notice('Ответ отправлен');return}
 if(a==='admin-close'){await api('/admin/ticket/status',{id:arg.id,status:'closed'});await loadAdmin();return}
 };run(act)});
async function start(){loadLocal();render();if(tg?.initData){await Promise.all([refreshLibrary(),refreshPlan(),checkOwner()]);}state.ready=true;render()}
start().catch(e=>notice(e.message));
</script>
