.overlay{position:absolute;inset:0;background:#0c0810bb;z-index:20;display:flex;align-items:flex-end;backdrop-filter:blur(9px);animation:fade .2s}.sheet{width:100%;max-height:90%;overflow:auto;padding:23px 19px 29px;background:linear-gradient(165deg,#37253e,#1e1825);border:1px solid #edbeee30;border-radius:29px 29px 0 0;box-shadow:0 -20px 60px #0007}.sheet h2{margin:0 0 6px;font-size:23px;letter-spacing:-.7px}.sheet p{color:#c9b6d0;font-size:12px}.close-sheet{float:right;background:#ffffff15;border:1px solid #ffffff14;color:#fff;border-radius:50%;width:34px;height:34px;font-size:22px}.toast{position:absolute;z-index:50;left:18px;right:18px;bottom:115px;background:#4b3055;color:#fff4fc;border:1px solid #d39ad95c;border-radius:16px;padding:13px 16px;text-align:center;box-shadow:0 15px 25px #0006;font-size:12px;animation:pop .22s}

<div id="app">
<header><span class="brand-icon"><svg viewBox="0 0 32 32"><path d="M16 2.4c2 8.8 4.2 11.5 13.3 13.6-9.1 2.1-11.3 4.8-13.3 13.6C14 20.8 11.8 18.1 2.7 16 11.8 13.9 14 11.2 16 2.4Z"/></svg></span><div class="brand"><strong>Аврора <span style="display:inline;color:#e6afd9;font-size:17px">✦</span></strong><span>Твоё AI-пространство</span></div><button class="top-button" id="new-chat" aria-label="Новый диалог"></button><button class="top-button" id="settings" aria-label="Настройки"></button></header>
<main><section class="page" id="chat-page"><div class="chat-stream" id="chat-stream"></div></section><section class="page hidden" id="create-page"></section><section class="page hidden" id="mine-page"></section></main>
<div class="composer-wrap" id="composer"><div id="attach-preview"></div><div class="compose-box"><button class="round-action" id="attach" aria-label="Прикрепить файл"></button><textarea id="message" rows="1" placeholder="Спроси Аврору о чём угодно…" maxlength="3000"></textarea><button class="round-action primary" id="send" aria-label="Отправить"></button></div><div class="compose-opt"><button class="text-toggle" id="web-toggle"><span class="small-dot"></span> Поиск в интернете</button><span id="usage-hint">Безопасный тестовый режим</span></div></div>
<nav class="bottom" id="bottom"><button class="nav selected" data-tab="chat"><span data-i="chat"></span>Диалог</button><button class="nav" data-tab="create"><span data-i="sparkles"></span>Создать</button><button class="nav" data-tab="mine"><span data-i="library"></span>Моё</button></nav>
<div id="modal"></div><div id="toast-root"></div><input type="file" id="file" hidden accept="image/jpeg,image/png,image/webp,.pdf,.docx,.doc,.txt,.md,.csv,.xlsx,.xls,.pptx,.ppt">
</div>
<script>
'use strict';
const API='https://aurora-ai.artykartunov.workers.dev';
const tg=window.Telegram?.WebApp||null;
const $=id=>document.getElementById(id);
const iconPaths={plus:'<path d="M12 5v14M5 12h14"/>',send:'<path d="m5 12 14-7-5 14-2-7-7 0Z"/><path d="m12 12 7-7"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',chat:'<path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.5-4.1A7.5 7.5 0 1 1 20 11.5Z"/>',sparkles:'<path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3Z"/><path d="m20 1 .6 2.4L23 4l-2.4.6L20 7l-.6-2.4L17 4l2.4-.6L20 1Z"/>',library:'<path d="M4 4h6v16H4zM10 4h6v16h-6zM16 4h4v16h-4z"/>',image:'<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m4 18 5-5 4 4 3-3 4 4"/>',film:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4V8Z"/>',file:'<path d="M7 2h7l5 5v15H7zM14 2v6h5M10 12h6M10 16h6"/>',arrow:'<path d="m9 5 7 7-7 7"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/>',trash:'<path d="M4 6h16M9 6V3h6v3M7 6l1 15h8l1-15"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>'};
const ico=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]||iconPaths.sparkles}</svg>`;
const escapeHtml=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={tab:'chat',busy:false,threadId:null,messages:[],threads:[],files:[],videos:[],attachment:null,web:false,profile:null,chatMode:'auto',me:null,toast:null,pending:null,images:[],lastImage:null,studioResult:null};
function currentUser(){return state.me?.user?.id||tg?.initDataUnsafe?.user?.id||'demo';}
const initData=tg?.initData||'';
const profileName=()=>state.me?.user?.firstName||tg?.initDataUnsafe?.user?.first_name||'друг';
function toast(message){$('toast-root').innerHTML=`<div class="toast">${escapeHtml(message)}</div>`;clearTimeout(toast._timer);toast._timer=setTimeout(()=>{$('toast-root').innerHTML=''},3500);}
async function api(path,data={}){
 if(!initData)throw Error('Для работы AI открой приложение внутри Telegram.');
 const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:JSON.stringify(data)});
 const obj=await r.json().catch(()=>({}));if(!r.ok)throw Error(obj.error||`Ошибка API ${r.status}`);return obj;
}
function chatBottom(){requestAnimationFrame(()=>{$('chat-page').scrollTop=$('chat-page').scrollHeight;});}
function msgHtml(m){
 const user=m.role==='user';const body=`<div class="message-text">${escapeHtml(m.text)}</div>`;
 const attachment=m.attachment?`<div class="msg-attachment">${ico('file')} ${escapeHtml(m.attachment)}</div>`:'';
 const cites=(m.citations||[]).length?`<div class="message-sources">${m.citations.map(c=>`<a href="${escapeHtml(c.url)}" rel="noreferrer noopener" target="_blank">${escapeHtml(c.title||'Источник')}</a>`).join('')}</div>`:'';
 const media=m.media&&m.media.kind==='image'?`<img class="media" src="${m.media.url}" alt="Изображение Авроры"><div class="media-actions"><button class="mini-btn" data-download-image="${escapeHtml(m.media.id||'')}">${ico('download')} Скачать фото</button></div>`:
 m.media&&m.media.kind==='video'?`<video controls playsinline preload="metadata" src="${escapeHtml(m.media.url)}"></video><div class="media-actions"><a class="mini-btn" href="${escapeHtml(m.media.url)}" target="_blank" rel="noreferrer">Открыть видео</a></div>`:'';
 return `<div class="message ${user?'user':'ai'}"><span class="message-label">${user?'ТЫ':'АВРОРА ✦'}</span><div class="bubble">${body}${attachment}${cites}${media}</div></div>`;
}
function loadingHtml(){let type=state.pending?.type||'chat';let title=type==='video'?'Создаю видео':type==='image'?'Создаю фотографию':'Аврора думает';return `<div class="loading-card"><div class="load-header"><span class="load-spin"></span>${escapeHtml(title)}</div><div class="load-hint">${type==='image'?'Подбираю свет, композицию и детали':type==='video'?'Готовлю сцену и движение':'Анализирую запрос и подготавливаю ответ'}</div><div class="shimmer"></div><div class="load-tail"><span>Генерация идёт</span><span class="dots">● ● ●</span></div></div>`}
function emptyChat(){return `<div class="empty-chat"><div class="aur-orb"><svg viewBox="0 0 32 32"><path d="M16 2.4c2 8.8 4.2 11.5 13.3 13.6-9.1 2.1-11.3 4.8-13.3 13.6C14 20.8 11.8 18.1 2.7 16 11.8 13.9 14 11.2 16 2.4Z"/></svg></div><h1>Привет, ${escapeHtml(profileName())}!<br><em>Я — Аврора.</em></h1><p>Можем обсудить идею, создать изображение, разобрать документ или придумать что-то новое.</p><div class="suggest-grid"><button class="suggest" data-suggest="Создай премиальную карточку товара для крема для рук"><span class="icon">${ico('sparkles')}</span><b>Карточка товара</b><small>Оформление и описание</small></button><button class="suggest" data-suggest="Помоги придумать идею для нового бизнеса"><span class="icon">${ico('chat')}</span><b>Идеи и проекты</b><small>От мысли до плана</small></button><button class="suggest" data-suggest="Создай красивое рекламное фото флакона духов на розовом фоне"><span class="icon">${ico('image')}</span><b>AI-фотография</b><small>Готовый визуал</small></button><button class="suggest" data-suggest="Составь структуру маркетинговой стратегии для малого магазина"><span class="icon">${ico('file')}</span><b>Работа и тексты</b><small>Помощь по делу</small></button></div></div>`}
function renderChat(){
 const s=$('chat-stream');s.innerHTML=state.messages.length?state.messages.map(msgHtml).join(''):emptyChat();
 if(state.pending){s.insertAdjacentHTML('beforeend',loadingHtml());chatBottom();}
 $('web-toggle').classList.toggle('on',state.web);
 $('usage-hint').textContent=state.me?.enabled?'AI подключён':'Режим предпросмотра';
 $('attach-preview').innerHTML=state.attachment?`<div class="file-preview">${state.attachment.kind==='image'?`<img src="${state.attachment.data}" alt="Прикреплённое фото">`:ico('file')}<span>${escapeHtml(state.attachment.name)}</span><button id="clear-attachment" aria-label="Удалить">×</button></div>`:'';
 $('send').disabled=state.busy;
}
function renderCreate(){
 $('create-page').innerHTML=`<h1 class="h-title">Студия Авроры ✦</h1><p class="h-sub">Здесь рождаются изображения и видео — без лишних настроек.</p><div class="studio-hero"><span>CREATIVE SPACE</span><strong>От идеи<br>к красивому результату.</strong></div><div class="section-label">Что создаём?</div><button class="menu-card" data-studio="image"><span class="menu-icon">${ico('image')}</span><span class="menu-desc"><b>AI-фотография</b><small>Создание из текста · обработка своих фото</small></span><span class="chevron">›</span></button><button class="menu-card" data-studio="video"><span class="menu-icon">${ico('film')}</span><span class="menu-desc"><b>AI-видео</b><small>Ролик 5 секунд · по описанию или фото</small></span><span class="chevron">›</span></button><div class="section-label">В твоём стиле</div><div class="panel"><p class="soft" style="margin:0">Напиши запрос в диалоге — Аврора сама определит, нужен текст, изображение или обработка фотографии. Видео пока включается вручную владельцем после проверки расходов.</p></div>`;
}
async function loadLibrary(){
 try{const [ts,vs]=await Promise.all([api('/api/threads'),api('/api/video/list')]);state.threads=ts.threads||[];state.videos=vs.videos||[];}catch(e){if(initData)toast(e.message)}
 try{state.images=await assetList()}catch{state.images=[]}
 renderMine();
}
function renderMine(){
 const used=state.me?.used||{},limits=state.me?.limits||{};
 $('mine-page').innerHTML=`<h1 class="h-title">Моё пространство</h1><p class="h-sub">Диалоги, созданные работы и настройки.</p><div class="panel"><div class="flex-row" style="justify-content:space-between;flex-wrap:wrap"><span class="status-chip">✦ ${state.me?.owner?'Владелец':'FREE · тест'}</span><span class="soft">Сутки · UTC</span></div><div class="flex-row" style="margin-top:14px;gap:8px"><span class="soft">Диалог: <b>${used.chat||0}/${limits.chat||'—'}</b></span><span class="soft">Фото: <b>${used.image||0}/${limits.image||'—'}</b></span><span class="soft">Видео: <b>${used.video||0}/${limits.video||'—'}</b></span></div></div><div class="section-label">История диалогов</div><div class="files-list">${state.threads.length?state.threads.map(t=>`<div class="thread-item"><button class="thread-item" data-thread="${escapeHtml(t.id)}" style="margin:0;flex:1;border:0;padding:0;background:none;min-width:0"><span><b>${escapeHtml(t.title)}</b><small>${new Date(t.updatedAt).toLocaleDateString('ru-RU')}</small></span></button><button class="danger-mini" data-delete="${escapeHtml(t.id)}" aria-label="Удалить диалог">×</button></div>`).join(''):'<div class="empty-list">Диалогов пока нет. Начни общение с Авророй.</div>'}</div><div class="section-label">Мои изображения</div><div class="files-list">${state.images.length?state.images.map(img=>`<div class="panel" style="display:flex;align-items:center;gap:12px"><img src="${img.url}" alt="Сохранённое изображение" style="width:66px;height:66px;object-fit:cover;border-radius:13px"><div style="flex:1;min-width:0"><b style="font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(img.prompt||'AI-фотография')}</b><small class="soft">Сохранено на этом устройстве</small></div><button class="mini-btn" data-download-image="${escapeHtml(img.id)}">Скачать</button></div>`).join(''):'<div class="empty-list">AI-фотографии появятся здесь после генерации.</div>'}</div><div class="section-label">Мои видео</div><div class="files-list">${state.videos.length?state.videos.map(v=>`<div class="panel" style="margin-bottom:5px"><b style="font-size:12px">${escapeHtml(v.prompt)}</b><p class="soft">${v.status==='ready'?'Готово':'Статус: '+escapeHtml(v.status)}</p>${v.url?`<video class="output-video" controls playsinline src="${escapeHtml(v.url)}"></video>`:''}</div>`).join(''):'<div class="empty-list">Здесь появятся созданные видеоролики.</div>'}</div><div class="section-label">Личные настройки</div><button class="menu-card" id="open-settings"><span class="menu-icon">${ico('settings')}</span><span class="menu-desc"><b>Память и приватность</b><small>Изменить предпочтения для ответов</small></span><span class="chevron">›</span></button>`;
}
function setTab(tab){
 state.tab=tab;for(const n of ['chat','create','mine'])$(n+'-page').classList.toggle('hidden',tab!==n);
 $('composer').style.display=tab==='chat'?'block':'none';
 document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('selected',x.dataset.tab===tab));
 if(tab==='mine')void loadLibrary(); if(tab==='chat')chatBottom();
}
function setBusy(on,type='chat'){state.busy=on;state.pending=on?{type}:null;renderChat();}
function newChat(){state.threadId=null;state.messages=[];state.attachment=null;$('message').value='';setTab('chat');renderChat();}
function askSuggested(text){$('message').value=text;setTab('chat');$('message').focus();}
function modeFromPrompt(text,att){
 const lower=text.toLowerCase();
 if(/(?:создай|сделай|сгенерируй|оживи|анимируй).{0,28}(?:видео|ролик|клип|рилс)/i.test(lower))return 'video';
 if(/(?:создай|сделай|сгенерируй|нарисуй|обработай|отредактируй|замени фон|улучши фото).{0,50}(?:фото|фотограф|изображени|картинк|обложк|картин|баннер|товар)/i.test(lower))return 'image';
 if(att?.kind==='image' && /(?:улучши|обработай|измени|удали фон|сделай фон|ретуш)/i.test(lower))return 'image';
 return 'chat';
}
async function send(){
 const text=$('message').value.trim(),attachment=state.attachment;
 if(!text)return toast('Напиши сообщение.');if(state.busy)return;
 const mode=modeFromPrompt(text,attachment);
 $('message').value='';state.attachment=null;
 const userMsg={role:'user',text,at:Date.now(),attachment:attachment?.name||null};state.messages.push(userMsg);
 setBusy(true,mode);
 try{
  if(mode==='chat'){
   const r=await api('/api/chat',{threadId:state.threadId,text,web:state.web,attachment});
   state.threadId=r.threadId;const ans=r.messages?.find(m=>m.role==='assistant');
   state.messages.push(ans||{role:'assistant',text:'Ответ не получен.'});
  } else if(mode==='image'){
   const finalPrompt=/карточк[а-яё]*\s+товар/i.test(text)?text+'\nСделай премиальную карточку с читаемым названием и только подтверждёнными характеристиками. Не придумывай медицинских и иных свойств товара.':text;
   const r=await api('/api/image',{prompt:finalPrompt,...(attachment?.kind==='image'?{image:attachment.data}:{})});
   const id=crypto.randomUUID();
   state.messages.push({role:'assistant',text:r.edited?'Обработала фотографию. Можешь посмотреть и скачать результат.':'Готово! Создала изображение по твоему запросу.',media:{kind:'image',url:r.image,id}});
   await assetPut(id,{kind:'image',url:r.image,prompt:text,at:Date.now()}).catch(()=>{});
  } else if(mode==='video'){
   const r=await api('/api/video/start',{prompt:text,...(attachment?.kind==='image'?{image:attachment.data}:{})});
   state.messages.push({role:'assistant',text:'Создание видео запущено. Продолжаю проверять результат…',jobId:r.jobId});
   setBusy(false);renderChat();void pollVideo(r.jobId);
   return;
  }
 }catch(e){state.messages.push({role:'assistant',text:`Не получилось выполнить запрос: ${e.message}`});}
 finally{setBusy(false);renderChat();chatBottom();}
}
async function pollVideo(jobId){
 const msg=state.messages.find(m=>m.jobId===jobId);if(!msg)return;
 for(let i=0;i<72;i++){
  await new Promise(r=>setTimeout(r,8500));
  try{
   const x=await api('/api/video/status',{jobId});
   if(x.status==='ready'){
    msg.text='Видео готово! Можешь посмотреть ролик прямо здесь.';msg.media={kind:'video',url:x.url};renderChat();chatBottom();return;
   }
   if(x.status==='failed'){msg.text='Не удалось создать видео: '+(x.error||'Ошибка');renderChat();return;}
   msg.text=x.status==='rendering'?'Создаю видео — обработка продолжается…':'Видео ожидает очередь генерации…';
   renderChat();
  }catch(e){if(i>3){msg.text='Проверка видео временно недоступна. Результат можно найти в «Моё».';renderChat();return;}}
 }
 msg.text='Создание видео длится дольше обычного. Результат появится в разделе «Моё».';renderChat();
}
async function assetPut(id,value){return new Promise((resolve,reject)=>{const req=indexedDB.open('aurora-reborn-assets',1);req.onupgradeneeded=()=>req.result.createObjectStore('assets');req.onerror=()=>reject(req.error);req.onsuccess=()=>{const db=req.result;const tr=db.transaction('assets','readwrite');tr.objectStore('assets').put(value,`${currentUser()}:${id}`);tr.oncomplete=()=>{db.close();resolve()};tr.onerror=()=>reject(tr.error)}})}
async function assetList(){return new Promise((resolve,reject)=>{const r=indexedDB.open('aurora-reborn-assets',1);r.onupgradeneeded=()=>r.result.createObjectStore('assets');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,out=[];const q=db.transaction('assets').objectStore('assets').openCursor();q.onsuccess=()=>{const cursor=q.result;if(!cursor){db.close();resolve(out.sort((a,b)=>b.at-a.at).slice(0,25));return}const key=String(cursor.key);if(key.startsWith(currentUser()+':')&&cursor.value?.kind==='image')out.push({...cursor.value,id:key.split(':').pop()});cursor.continue()};q.onerror=()=>{db.close();reject(q.error)}}})}
async function assetGet(id){return new Promise((resolve,reject)=>{const req=indexedDB.open('aurora-reborn-assets',1);req.onerror=()=>reject(req.error);req.onsuccess=()=>{const db=req.result;const tr=db.transaction('assets');const g=tr.objectStore('assets').get(`${currentUser()}:${id}`);g.onsuccess=()=>{db.close();resolve(g.result||null)};g.onerror=()=>reject(g.error)}})}
async function chooseAttachment(file){
 if(!file)return;
 try{
  if(file.type.startsWith('image/')||/\.(?:jpe?g|png|webp|heic|heif)$/i.test(file.name)){
   if(file.size>12_000_000)throw Error('Фото слишком большое: максимум 12 МБ.');
   const data=await resizePhoto(file);state.attachment={kind:'image',data,name:file.name};
  }else{
   if(file.size>2_000_000)throw Error('Документ слишком большой (максимум 2 МБ).');
   const ext=file.name.split('.').pop().toLowerCase();if(!['pdf','doc','docx','txt','md','csv','xls','xlsx','ppt','pptx'].includes(ext))throw Error('Этот формат пока не поддерживается.');
   const data=await fileAsDataUrl(file);state.attachment={kind:'file',data,name:file.name};
  }
  renderChat();toast('Вложение готово. Опиши, что нужно сделать.');
 }catch(e){toast(e.message)}
}
function fileAsDataUrl(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('Не удалось открыть файл'));r.readAsDataURL(file);});}
async function resizePhoto(file){
 let img;try{img=await createImageBitmap(file)}catch{const url=URL.createObjectURL(file);try{img=await new Promise((ok,no)=>{const image=new Image();image.onload=()=>ok(image);image.onerror=()=>no(Error('Этот формат фото не поддерживается. Выбери JPEG.'));image.src=url})}finally{URL.revokeObjectURL(url)}}const max=1100,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);img.close?.();return c.toDataURL('image/jpeg',.78);
}
function downloadImage(url){const a=document.createElement('a');a.href=url;a.download='Aurora_AI.png';a.click();}
function openStudio(mode){
 $('modal').innerHTML=`<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true"><button class="close-sheet" id="close-modal">×</button><h2>${mode==='image'?'Создать фотографию ✦':'Создать видео ✦'}</h2><p>${mode==='image'?'Опиши кадр или прикрепи фото для изменения.':'Опиши движение и настроение. Видео платное и пока доступно только владельцу для тестирования.'}</p><label class="field-label">Описание</label><textarea class="field" id="studio-prompt" style="min-height:104px;resize:vertical" placeholder="Например: премиальная рекламная съёмка флакона духов..."></textarea><label class="field-label">Исходная фотография (необязательно)</label><input type="file" id="studio-file" accept="image/*" class="field" style="padding:10px"><div class="notice">${mode==='image'?'Фото будет создано через OpenAI и появится в диалоге.':'После запуска видеозадачу можно отслеживать в разделе «Моё».'}</div><button class="main-btn" style="width:100%" id="studio-go" data-studio-mode="${mode}">${mode==='image'?'Создать фото':'Запустить видео'}</button></div></div>`;
}
async function runStudio(mode){
 const text=$('studio-prompt')?.value.trim();const file=$('studio-file')?.files?.[0];if(!text||text.length<6)return toast('Добавь описание.');
 let att=null;if(file){att={kind:'image',name:file.name,data:await resizePhoto(file)}}
 $('modal').innerHTML='';state.attachment=att;
 $('message').value=mode==='image'?`Создай фотографию: ${text}`:`Создай видео: ${text}`;
 setTab('chat');void send();
}
function showSettings(){
 $('modal').innerHTML=`<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true"><button class="close-sheet" id="close-modal">×</button><h2>Настройки</h2><p>Твоё пространство и предпочтения.</p><div class="notice">Модель: <b>${escapeHtml(state.me?.model||'по умолчанию')}</b>. Новая версия не имеет общей памяти с ChatGPT.</div><label class="field-label">Что Авроре важно учитывать</label><textarea id="memory" class="field" style="min-height:104px;resize:vertical" maxlength="600" placeholder="Например: отвечай кратко и помогай с моим магазином"></textarea><button id="save-memory" class="main-btn" style="width:100%;margin-top:13px">Сохранить предпочтения</button><p class="soft">Диалоги хранятся в подключённом KV Cloudflare. Не отправляй пароли, секретные ключи и лишние личные данные.</p><button class="secondary-btn" id="close-modal-two" style="width:100%;margin-top:10px">Закрыть</button></div></div>`;
 void api('/api/memory').then(x=>{if($('memory'))$('memory').value=x.memory||''}).catch(()=>{});
}
async function loadMe(){
 try{state.me=await api('/api/me');}catch(e){if(initData)toast(e.message);}
 renderChat();renderMine();
}
async function openThread(id){
 try{const r=await api('/api/thread',{id});if(!r.thread)throw Error('Диалог не найден');state.threadId=id;state.messages=r.thread.messages||[];setTab('chat');renderChat();chatBottom();}
 catch(e){toast(e.message)}
}
async function doDelete(id){
 if(!confirm('Удалить этот диалог?'))return;
 try{await api('/api/delete',{id});state.threads=state.threads.filter(x=>x.id!==id);if(state.threadId===id)newChat();renderMine();}
 catch(e){toast(e.message)}
}
function updateTopSafe(){
 const a=Number(tg?.contentSafeAreaInset?.top||0),b=Number(tg?.safeAreaInset?.top||0);let px=Math.min(60,Math.max(0,a,b));document.documentElement.style.setProperty('--tgsafe',`${Math.max(16,px)}px`);
}
$('new-chat').innerHTML=ico('plus');$('settings').innerHTML=ico('settings');$('attach').innerHTML=ico('plus');$('send').innerHTML=ico('send');
document.querySelectorAll('[data-i]').forEach(el=>el.innerHTML=ico(el.dataset.i));
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('settings').onclick=showSettings;$('new-chat').onclick=newChat;
$('attach').onclick=()=>$('file').click();$('file').onchange=e=>{void chooseAttachment(e.target.files[0]);e.target.value=''};
$('send').onclick=()=>void send();$('web-toggle').onclick=()=>{state.web=!state.web;renderChat();};
$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();void send();}});
$('chat-stream').addEventListener('click',e=>{
 const suggest=e.target.closest('[data-suggest]');if(suggest){askSuggested(suggest.dataset.suggest);return;}
 const dl=e.target.closest('[data-download-image]');if(dl)void assetGet(dl.dataset.downloadImage).then(x=>{if(x?.url)downloadImage(x.url)});
});
$('attach-preview').addEventListener('click',e=>{if(e.target.closest('#clear-attachment')){state.attachment=null;renderChat();}});
$('create-page').addEventListener('click',e=>{const b=e.target.closest('[data-studio]');if(b)openStudio(b.dataset.studio);});
$('mine-page').addEventListener('click',e=>{
 const b=e.target.closest('[data-thread]');if(b){void openThread(b.dataset.thread);return;}
 const img=e.target.closest('[data-download-image]');if(img){void assetGet(img.dataset.downloadImage).then(x=>{if(x?.url)downloadImage(x.url)});return;}
 const d=e.target.closest('[data-delete]');if(d){void doDelete(d.dataset.delete);return;}
 if(e.target.closest('#open-settings'))showSettings();
});
$('modal').addEventListener('click',async e=>{
 if(e.target.id==='overlay'||e.target.closest('#close-modal,#close-modal-two')){$('modal').innerHTML='';return;}
 if(e.target.closest('#save-memory')){try{await api('/api/memory',{text:$('memory').value});toast('Настройки сохранены');$('modal').innerHTML='';}catch(err){toast(err.message)}return;}
 const b=e.target.closest('#studio-go');if(b){try{await runStudio(b.dataset.studioMode)}catch(err){toast(err.message)}return;}
});
function init(){
 if(tg){tg.ready();tg.expand?.();tg.setHeaderColor?.('#211729');tg.setBackgroundColor?.('#15101a');tg.onEvent?.('safeAreaChanged',updateTopSafe);tg.onEvent?.('contentSafeAreaChanged',updateTopSafe)}
 updateTopSafe();setTab('chat');renderChat();renderCreate();renderMine();void loadMe();
}
init();
</script></body></html>
